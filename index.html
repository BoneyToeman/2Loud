<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2Loud — Concert & Venue Digital Billboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Atkinson Hyperlegible"', 'Lexend', 'sans-serif'],
            display: ['"Atkinson Hyperlegible"', 'Lexend', 'sans-serif'],
          },
          colors: {
            oled: '#000000',
            surface: '#0B0B0F',
            elevated: '#14141C',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --accent-color: #39FF14;
      --accent-glow: rgba(57, 255, 20, 0.42);
      --accent-soft: rgba(57, 255, 20, 0.14);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Atkinson Hyperlegible', 'Lexend', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Hide scrollbars on horizontal preset strip while keeping touch scroll smooth */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Neon text glow for dark venues */
    .billboard-text-glow {
      text-shadow: 0 0 28px var(--accent-glow), 0 0 8px var(--accent-soft);
    }

    /* Blinking typing caret on billboard */
    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .custom-caret {
      display: inline-block;
      width: 0.06em;
      min-width: 3px;
      height: 0.85em;
      background-color: var(--accent-color);
      margin-left: 0.06em;
      vertical-align: -0.06em;
      border-radius: 2px;
      animation: caretBlink 1s infinite;
    }

    /* Subtle eye-catching neon border pulse for dark rooms */
    @keyframes neonBorderPulse {
      0%, 100% {
        box-shadow: inset 0 0 18px 2px var(--accent-soft), 0 0 10px var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.14);
      }
      50% {
        box-shadow: inset 0 0 46px 8px var(--accent-glow), 0 0 28px var(--accent-glow);
        border-color: var(--accent-color);
      }
    }
    .pulse-active {
      animation: neonBorderPulse 1.6s ease-in-out infinite;
    }

    /* 90-degree landscape billboard rotation */
    .landscape-rotated {
      transform: rotate(90deg);
    }

    /* Custom subtle dark scrollbar inside Recent drawer */
    .drawer-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .drawer-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .drawer-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-black text-white font-sans select-none">
  <!-- App Shell: Full-height mobile-first frame centered nicely on desktop -->
  <div id="appShell" class="relative w-full h-full flex flex-col items-center justify-center bg-black md:p-4">
    <!-- Mobile Frame on Desktop / Full Viewport on Mobile -->
    <div id="deviceFrame" class="relative w-full h-full md:max-w-[440px] md:h-[92vh] md:max-h-[880px] flex flex-col bg-black md:rounded-[34px] md:border md:border-white/15 md:shadow-[0_25px_90px_rgba(0,0,0,0.95)] overflow-hidden">

      <!-- Top Header Bar -->
      <header id="topBar" class="relative z-20 shrink-0 flex items-center justify-between px-3 py-2.5 bg-surface/95 border-b border-white/10 backdrop-blur-md">
        <!-- Brand Mark & Color Swatch Picker -->
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow);"></span>
            <span class="font-display font-extrabold tracking-tight text-base text-white">2LOUD</span>
          </div>

          <!-- High-Contrast Color Swatches -->
          <div id="colorSwatches" class="flex items-center gap-1.5 pl-1" role="group" aria-label="Billboard text color">
            <button type="button" data-color="#39FF14" aria-label="Neon Green" class="color-swatch w-5 h-5 rounded-full bg-[#39FF14] ring-2 ring-white scale-105 transition-transform"></button>
            <button type="button" data-color="#FFFFFF" aria-label="Pure White" class="color-swatch w-5 h-5 rounded-full bg-[#FFFFFF] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#FFE600" aria-label="Electric Yellow" class="color-swatch w-5 h-5 rounded-full bg-[#FFE600] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#00F0FF" aria-label="Cyber Cyan" class="color-swatch w-5 h-5 rounded-full bg-[#00F0FF] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#FF2A85" aria-label="Hot Magenta" class="color-swatch w-5 h-5 rounded-full bg-[#FF2A85] opacity-75 hover:opacity-100 transition-opacity"></button>
          </div>
        </div>

        <!-- Top Right Actions: Recent Drawer, Reaction Cam & SHOW Mode -->
        <div class="flex items-center gap-2">
          <button id="recentBtn" type="button" class="relative flex items-center gap-1.5 px-3 py-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/10 text-xs font-semibold text-white/90 transition">
            <span>Recent</span>
            <span id="recentBadge" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-white/15 text-white">0</span>
          </button>

          <button id="reactionCamBtn" type="button" aria-label="Toggle Reaction Camera" title="Arm front camera for 3s reaction snapshot on SHOW" class="relative flex items-center justify-center p-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/10 text-white/85 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span id="camArmedDot" class="hidden absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-black"></span>
          </button>

          <button id="showModeBtn" type="button" class="px-3.5 py-2 rounded-xl font-display font-extrabold text-xs tracking-wider uppercase text-black active:scale-95 transition shadow-md" style="background-color: var(--accent-color);">
            SHOW
          </button>
        </div>
      </header>

      <!-- Main OLED Billboard Display Stage -->
      <main id="billboardStage" role="button" tabindex="0" aria-label="Tap to type message" class="relative flex-1 min-h-0 w-full bg-black flex items-center justify-center overflow-hidden border-2 border-transparent transition-colors duration-200 cursor-text">
        <!-- Subtle 3s Reaction Cam Countdown Pill in Show Mode -->
        <div id="camCountdownPill" class="hidden pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/75 border border-white/15 backdrop-blur-md text-[11px] font-bold tracking-wide text-white/90">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
          <span id="camCountdownText">Reaction Cam in 3s...</span>
        </div>

        <!-- Subtle corner framing ticks (hidden in Show Mode) -->
        <div id="cornerGuides" class="pointer-events-none absolute inset-3 flex flex-col justify-between opacity-25 transition-opacity duration-200">
          <div class="flex justify-between">
            <span class="w-3 h-3 border-t-2 border-l-2 border-white/60 rounded-tl-sm"></span>
            <span class="w-3 h-3 border-t-2 border-r-2 border-white/60 rounded-tr-sm"></span>
          </div>
          <div class="flex justify-between">
            <span class="w-3 h-3 border-b-2 border-l-2 border-white/60 rounded-bl-sm"></span>
            <span class="w-3 h-3 border-b-2 border-r-2 border-white/60 rounded-br-sm"></span>
          </div>
        </div>

        <!-- Empty state prompt when message is cleared -->
        <div id="emptyPrompt" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-10">
          <p class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight text-white/45">TAP TO TYPE</p>
          <p class="text-xs text-white/30 mt-1.5">Or pick a preset below</p>
        </div>

        <!-- Rotatable 90° Landscape Container -->
      <div id="rotatableContainer" class="flex items-center justify-center transition-transform duration-300 ease-out">
        <div id="textFitBox" class="w-full h-full flex items-center justify-center overflow-hidden">
          <div id="billboardText" class="font-bold uppercase tracking-tight leading-tight text-center billboard-text-glow transition-colors duration-150" style="font-family: 'Atkinson Hyperlegible', 'Lexend', sans-serif; color: var(--accent-color); font-size: 48px; word-break: keep-all; overflow-wrap: normal; hyphens: none;">
            <span id="billboardTextContent"></span><span id="billboardCaret" class="custom-caret" style="visibility: hidden;"></span>
          </div>
        </div>
      </div>

      <!-- Subtle floating exit hint in Show Mode -->
      <div id="showModeOverlayHint" class="hidden absolute bottom-2 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2">
        <button id="exitShowModeBtn" type="button" class="px-2.5 py-1 rounded-full bg-white/[0.07] hover:bg-white/20 active:scale-95 backdrop-blur-sm border border-white/10 text-[10px] font-semibold uppercase tracking-wider text-white/45 hover:text-white/90 transition">
          Exit Show Mode
        </button>
      </div>
    </main>

    <!-- Hidden video & canvas elements for silent front-camera reaction capture -->
    <video id="reactionVideo" playsinline muted class="hidden"></video>
    <canvas id="reactionCanvas" class="hidden"></canvas>

    <!-- Bottom Control Dock: Presets, Action Bar & Fast Input -->
    <section id="bottomDock" class="relative z-20 shrink-0 flex flex-col gap-2 px-3 pt-2 pb-3 bg-surface/95 border-t border-white/10 backdrop-blur-md">
      <!-- Horizontal Preset Strip + '+ Add Preset' + 'Edit Presets' -->
      <div class="relative">
        <div id="presetStrip" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" aria-label="Quick venue presets">
          <button type="button" data-preset="LOUDER PLEASE 🔊" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">LOUDER PLEASE 🔊</button>
          <button type="button" data-preset="WHAT DID YOU SAY? 👂" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">WHAT DID YOU SAY? 👂</button>
          <button type="button" data-preset="OVER HERE! 👋" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">OVER HERE! 👋</button>
          <button type="button" data-preset="GREAT SET! 🙌" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">GREAT SET! 🙌</button>
          <button type="button" data-preset="NEED WATER 💧" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">NEED WATER 💧</button>
          <button id="addPresetBtn" type="button" style="border-color: var(--accent-color); color: var(--accent-color);" class="shrink-0 px-3.5 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-dashed text-xs font-extrabold uppercase tracking-wide transition">+ ADD PRESET</button>
        </div>

        <!-- Edit Presets Dropdown Menu -->
        <div id="editPresetsMenu" class="hidden absolute bottom-full right-0 mb-2 z-30 w-64 max-w-[calc(100vw-2rem)] rounded-2xl bg-surface border border-white/15 shadow-2xl overflow-hidden">
          <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-white/10 bg-elevated/70">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-white/80">Edit Presets</span>
            <button id="clearAllPresetsBtn" type="button" class="px-2 py-1 rounded-lg bg-red-500/15 hover:bg-red-500/25 active:scale-95 text-[11px] font-extrabold uppercase tracking-wide text-red-400 transition">
              Clear All
            </button>
          </div>
          <div id="editPresetsList" class="max-h-52 overflow-y-auto drawer-scroll divide-y divide-white/10 p-1.5"></div>
        </div>
      </div>

      <!-- Fast Message Input Box -->
      <div class="relative flex items-center">
        <input id="messageInput" type="text" maxlength="160" placeholder="Type loud message here..." autocomplete="off" autocapitalize="characters" spellcheck="true" aria-label="Message input" class="w-full rounded-2xl bg-elevated border border-white/15 focus:border-white/40 focus:outline-none pl-4 pr-11 py-2.5 text-sm font-bold uppercase tracking-wide text-white placeholder:text-white/35 placeholder:normal-case placeholder:font-normal transition" />
        <button id="clearInputBtn" type="button" aria-label="Clear message input" class="absolute right-2 p-1.5 rounded-xl text-white/50 hover:text-white hover:bg-white/10 active:scale-95 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Primary Action Row: Type, Landscape, Pulse, Reply / Clear -->
      <div class="grid grid-cols-4 gap-2">
        <button id="typeBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
          </svg>
          <span>Type</span>
        </button>

        <button id="landscapeBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
          <svg id="landscapeIcon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <path d="M12 18h.01"></path>
          </svg>
          <span id="landscapeLabel">Landscape</span>
        </button>

        <button id="pulseBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
          <span id="pulseDot" class="w-2.5 h-2.5 rounded-full bg-white/40 transition"></span>
          <span>Pulse</span>
        </button>

        <button id="replyClearBtn" type="button" class="flex items-center justify-center gap-1 py-2.5 px-2 rounded-xl bg-white/12 hover:bg-white/20 active:scale-95 border border-white/15 text-xs font-extrabold text-white transition">
          <span>Reply / Clear</span>
        </button>
      </div>
    </section>

    <!-- Recent Messages Slide-Up Drawer -->
    <div id="recentDrawer" class="hidden fixed inset-0 z-40 flex items-end justify-center bg-black/75 backdrop-blur-sm">
      <div class="w-full max-w-[440px] max-h-[75vh] flex flex-col rounded-t-3xl bg-surface border-t border-x border-white/15 p-4 shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-white/10">
          <div>
            <h2 class="font-display font-extrabold text-base text-white">Recent Messages</h2>
            <p class="text-[11px] text-white/45">Tap any message to display it immediately</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="clearHistoryBtn" type="button" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-[11px] font-bold text-white/75 transition">
              Clear All
            </button>
            <button id="closeRecentBtn" type="button" aria-label="Close recent drawer" class="p-2 rounded-xl bg-elevated hover:bg-white/15 text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="recentList" class="flex-1 overflow-y-auto drawer-scroll py-3 space-y-2"></div>
      </div>
    </div>

    <!-- Reaction Snapshot Preview Modal -->
    <div id="photoPreviewModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
      <div class="w-full max-w-sm rounded-3xl bg-surface border border-white/15 p-4 shadow-2xl space-y-3">
        <div class="flex items-center justify-between">
          <div class="min-w-0 pr-2">
            <h3 class="font-display font-extrabold text-sm text-white">Reaction Snapshot</h3>
            <p id="photoPreviewCaption" class="truncate text-xs text-white/55 uppercase font-bold"></p>
          </div>
          <button id="closePhotoModalBtn" type="button" aria-label="Close photo preview" class="p-1.5 rounded-xl bg-elevated hover:bg-white/15 text-white/75 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="overflow-hidden rounded-2xl border border-white/10 bg-black">
          <img id="photoPreviewImg" src="" alt="Reaction snapshot" class="w-full h-auto max-h-[60vh] object-contain mx-auto" />
        </div>
        <div class="flex items-center justify-end gap-2">
          <a id="downloadPhotoBtn" href="#" download="2loud-reaction.jpg" class="px-4 py-2 rounded-xl text-xs font-extrabold uppercase tracking-wide text-black transition" style="background-color: var(--accent-color);">
            Save Photo
          </a>
        </div>
      </div>
    </div>

    <!-- Add Custom Preset Modal -->
    <div id="addPresetModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
      <div class="w-full max-w-sm rounded-3xl bg-surface border border-white/15 p-5 shadow-2xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-display font-extrabold text-base text-white">Add Custom Preset</h3>
          <button id="closePresetModalBtn" type="button" aria-label="Close preset modal" class="p-1.5 rounded-xl bg-elevated hover:bg-white/15 text-white/75 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <form id="addPresetForm" class="space-y-3">
          <input id="newPresetInput" type="text" maxlength="60" placeholder="e.g., MEET AT THE BAR 🍹" class="w-full rounded-2xl bg-elevated border border-white/15 focus:border-white/40 focus:outline-none px-4 py-3 text-sm font-bold uppercase tracking-wide text-white placeholder:text-white/35 placeholder:normal-case placeholder:font-normal" />
          <div class="flex items-center justify-end gap-2">
            <button id="cancelPresetBtn" type="button" class="px-4 py-2.5 rounded-xl bg-elevated hover:bg-white/15 text-xs font-bold text-white/75 transition">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2.5 rounded-xl text-xs font-extrabold uppercase tracking-wide text-black transition" style="background-color: var(--accent-color);">
              Save Preset
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Are You Sure Delete Confirmation Modal -->
    <div id="confirmDeleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
      <div class="w-full max-w-xs rounded-3xl bg-surface border border-white/15 p-5 shadow-2xl space-y-4">
        <div class="space-y-1.5">
          <h3 id="confirmDeleteTitle" class="font-display font-extrabold text-base text-white">Are you sure?</h3>
          <p id="confirmDeleteMessage" class="text-xs text-white/60 leading-relaxed">This action cannot be undone.</p>
        </div>
        <div class="flex items-center justify-end gap-2">
          <button id="cancelDeleteBtn" type="button" class="px-4 py-2.5 rounded-xl bg-elevated hover:bg-white/15 text-xs font-bold text-white/80 transition">
            Cancel
          </button>
          <button id="confirmDeleteBtn" type="button" class="px-4 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 active:scale-95 text-xs font-extrabold uppercase tracking-wide text-white transition">
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toastBanner" class="pointer-events-none fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-elevated/95 border border-white/15 text-xs font-bold text-white shadow-xl opacity-0 translate-y-2 transition-all duration-200"></div>
  </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    (async () => {
      const DEFAULT_PRESETS = [
        'LOUDER PLEASE 🔊',
        'WHAT DID YOU SAY? 👂',

            if (Array.isArray(parsedRecent)) {
              state.recent = parsedRecent
                .filter((item) => item && typeof item.text === 'string' && item.text.trim())
                .map((item) => ({
                  id: item.id || `msg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                  text: item.text,
                  color: item.color || '#39FF14',
                  isPulseActive: Boolean(item.isPulseActive),
                  isLandscape: Boolean(item.isLandscape),
                  isPhotoOnly: Boolean(item.isPhotoOnly),
                  photo: item.photo || null,
                  updatedAt: Number(item.updatedAt) || 0,
                }))
                .sort((a, b) => b.updatedAt - a.updatedAt);
            }
          }
        } catch (err) {
          console.error('Error reading recent history from localStorage:', err);
        }

        try {
          const rawPresets = localStorage.getItem(LOCAL_PRESETS_KEY);
          if (rawPresets) {
            const parsedPresets = JSON.parse(rawPresets);
            if (Array.isArray(parsedPresets) && parsedPresets.length > 0) {
              state.presets = parsedPresets.filter((p) => typeof p === 'string' && p.trim());
            }
          }
        } catch (err) {
          console.error('Error reading presets from localStorage:', err);

          try {
            const stripped = state.recent.map(({ photo, ...rest }) => ({ ...rest, photo: null }));
            localStorage.setItem(LOCAL_RECENT_KEY, JSON.stringify(stripped));
          } catch (fallbackErr) {

      function stopReactionCam() {
        clearPendingCamTimers();

      async function toggleReactionCam() {
        if (state.isCamArmed) {
          stopReactionCam();
          showToast('Reaction Cam off');
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Camera not supported on this browser');
          return;
        }

        try {
          try {
            camStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user' },
              audio: false,
            });
          } catch (primaryErr) {
            if (primaryErr && (primaryErr.name === 'NotFoundError' || primaryErr.name === 'OverconstrainedError')) {
              camStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false,
              });
            } else {
              throw primaryErr;
            }
          }
          if (reactionVideo) {
            reactionVideo.srcObject = camStream;
            await reactionVideo.play();
          }
          state.isCamArmed = true;
          updateCamButtonUI();
          showToast('Reaction Cam armed (3s after SHOW)');
        } catch (err) {
          state.isCamArmed = false;
          updateCamButtonUI();
          if (err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')) {
            showToast('No camera detected on this device');
          } else if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
            showToast('Camera permission denied');
          } else {
            showToast('Could not access camera');
          }
        }
      }

      function captureReactionSnapshot(targetEntryId) {
        if (!camStream || !reactionVideo || !reactionCanvas) return;
        const rawW = reactionVideo.videoWidth || 640;
        const rawH = reactionVideo.videoHeight || 480;
        // Scale down cleanly so snapshots stay lightweight for storage & memory
        const maxDim = 360;
        const scale = Math.min(1, maxDim / Math.max(rawW, rawH));
        const width = Math.round(rawW * scale);
        const height = Math.round(rawH * scale);

        reactionCanvas.width = width;
        reactionCanvas.height = height;
        const ctx = reactionCanvas.getContext('2d');
        if (!ctx) return;

        // Mirror horizontally so front-facing selfie view looks natural
        ctx.save();
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(reactionVideo, 0, 0, width, height);
        ctx.restore();

        const dataUrl = reactionCanvas.toDataURL('image/jpeg', 0.62);
        attachPhotoToRecent(targetEntryId, dataUrl);
        showToast('Reaction captured! 📸');
      }

      function startReactionCountdown(targetEntryId) {

        camCountdownTimer = setInterval(() => {
          secondsLeft -= 1;
          if (secondsLeft > 0) {
            if (camCountdownText) camCountdownText.textContent = `Reaction Cam in ${secondsLeft}s...`;
          } else {
            clearInterval(camCountdownTimer);
            camCountdownTimer = null;
          }

        camCaptureTimeout = setTimeout(() => {
          if (camCountdownPill) camCountdownPill.classList.add('hidden');
          captureReactionSnapshot(targetEntryId);

      async function addToRecent(phrase, options = {}) {
        const clean = (phrase || '').trim();
        const allowPhotoOnly = Boolean(options.allowPhotoOnly);
        if (!clean && !allowPhotoOnly) return null;

        const displayText = clean || 'REACTION SNAPSHOT';
        const now = Date.now();
        const entryId = `msg_${now}_${Math.random().toString(36).slice(2, 8)}`;

        // Only deduplicate text messages; always keep distinct reaction captures
        const duplicate = !allowPhotoOnly
          ? state.recent.find(
              (item) =>
                !item.isPhotoOnly &&
                item.text === displayText &&
                item.color === state.activeColor &&
                Boolean(item.isPulseActive) === state.isPulseActive &&
                Boolean(item.isLandscape) === state.isLandscape
            )
          : null;

        const targetId = duplicate ? duplicate.id : entryId;
        const existingPhoto = duplicate ? duplicate.photo || null : null;

        const newEntry = {
          id: targetId,
          text: displayText,
          color: state.activeColor,
          isPulseActive: state.isPulseActive,
          isLandscape: state.isLandscape,
          isPhotoOnly: allowPhotoOnly && !clean,
          photo: existingPhoto,
          updatedAt: now,
        };

        state.recent = [newEntry, ...state.recent.filter((item) => item.id !== targetId)];
        persistRecentLocally();
        updateRecentBadge();
        renderRecentList();

        if (db && currentUser) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', targetId);
            await setDoc(docRef, {
              text: newEntry.text,
              color: newEntry.color,
              isPulseActive: newEntry.isPulseActive,
              isLandscape: newEntry.isLandscape,
              isPhotoOnly: newEntry.isPhotoOnly,
              photo: newEntry.photo || null,
              updatedAt: newEntry.updatedAt,
            });
          } catch (err) {
            console.error('Error saving recent message:', err);
          }
        }

        return targetId;
      }

      async function clearAllRecentItems() {

        updateRecentBadge();
        renderRecentList();
        showToast('History cleared');

        if (!db || !currentUser || !itemsToDelete.length) return;

          // Delete in batches of 450 to stay safely within Firestore batch limits
          for (let i = 0; i < itemsToDelete.length; i += 450) {
            const batch = writeBatch(db);
            itemsToDelete.slice(i, i + 450).forEach((item) => {
              const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', item.id);
              batch.delete(docRef);

            await batch.commit();

      // --- Delete Confirmation Modal Handlers ---

      // --- Dynamic Auto-Scaling Font Solver (Word-Aware Wrapping) ---
      function fitTextToBillboard() {
        try {
          if (!billboardStage || !rotatableContainer || !textFitBox || !billboardText || !billboardTextContent) {
            return;
          }

          const rawText = state.text;
          const trimmedText = rawText.trim();
          billboardTextContent.textContent = rawText;

          if (!trimmedText) {
            if (emptyPrompt) emptyPrompt.classList.remove('hidden');
            billboardText.style.fontSize = '48px';
            billboardText.style.width = 'auto';
            billboardText.style.display = 'inline-block';
            updateCaretVisibility();
            return;
          }

          if (emptyPrompt) emptyPrompt.classList.add('hidden');

          const stageRect = billboardStage.getBoundingClientRect();
          if (!stageRect || stageRect.width <= 0 || stageRect.height <= 0) return;

          const horizontalPad = 24;
          const verticalPad = state.isShowMode ? 56 : 20;

          // Measure the outer stage rect and use its unrotated dimensions as the
          // true visual bounding box so rotating 90deg never measures a mid-transition
          // or pre-rotated box incorrectly.
          const stageWidth = stageRect.width;
          const stageHeight = stageRect.height;

          let availableWidth;
          let availableHeight;

          if (state.isLandscape) {
            // Rotated 90deg: visual horizontal axis comes from stageHeight,
            // visual vertical axis comes from stageWidth.
            rotatableContainer.style.width = `${stageHeight}px`;
            rotatableContainer.style.height = `${stageWidth}px`;
            availableWidth = Math.max(32, stageHeight - horizontalPad);
            availableHeight = Math.max(32, stageWidth - verticalPad);
          } else {
            rotatableContainer.style.width = `${stageWidth}px`;
            rotatableContainer.style.height = `${stageHeight}px`;
            availableWidth = Math.max(32, stageWidth - horizontalPad);
            availableHeight = Math.max(32, stageHeight - verticalPad);
          }

          // Constrain the text block box to the available width so multi-line wrapping
          // breaks cleanly between words instead of expanding past the container.
          textFitBox.style.width = `${availableWidth}px`;
          textFitBox.style.height = `${availableHeight}px`;

          // Ensure text width allows lines to expand toward full availableWidth
          // while still wrapping strictly at spaces between words.
          billboardText.style.maxWidth = `${availableWidth}px`;
          billboardText.style.width = '100%';
          billboardText.style.display = 'block';
          billboardText.style.whiteSpace = 'normal';
          billboardText.style.wordBreak = 'keep-all';
          billboardText.style.overflowWrap = 'normal';
          billboardText.style.hyphens = 'none';

          // Hide caret during binary search measurement so width never fluctuates
          const prevCaretVisibility = billboardCaret ? billboardCaret.style.visibility : 'visible';
          if (billboardCaret) {
            billboardCaret.style.visibility = 'hidden';
          }

          const minSize = 24;
          const maxSize = 420;
          let low = minSize;
          let high = maxSize;
          let bestSize = minSize;

          // Temporarily disable CSS transform transition during measurement so
          // bounding box readings reflect the exact target orientation immediately.
          const prevTransition = rotatableContainer.style.transition;
          rotatableContainer.style.transition = 'none';

          while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            billboardText.style.fontSize = `${mid}px`;

            const textRect = billboardText.getBoundingClientRect();
            const measuredWidth = state.isLandscape ? textRect.height : textRect.width;
            const measuredHeight = state.isLandscape ? textRect.width : textRect.height;

            const fitsWidth =
              measuredWidth <= availableWidth + 0.5 &&
              billboardText.scrollWidth <= availableWidth + 1 &&
              textFitBox.scrollWidth <= availableWidth + 1;
            const fitsHeight =
              measuredHeight <= availableHeight + 0.5 &&
              billboardText.scrollHeight <= availableHeight + 1 &&
              textFitBox.scrollHeight <= availableHeight + 1;

            if (fitsWidth && fitsHeight) {
              bestSize = mid;
              low = mid + 1;
            } else {
              high = mid - 1;
            }
          }

          billboardText.style.fontSize = `${bestSize}px`;
          rotatableContainer.style.transition = prevTransition;
          updateCaretVisibility();
        } catch (err) {
          console.error('Error fitting text to billboard:', err);
        }
      }

      function scheduleFit() {
        if (fitRafId !== null) {
          cancelAnimationFrame(fitRafId);
        }
        fitRafId = requestAnimationFrame(() => {
          fitRafId = requestAnimationFrame(() => {
            fitTextToBillboard();
            fitRafId = null;
          });
        });
      }

      // Run multiple passes across orientation changes so CSS layout/viewport
      // shifts settle completely before locking in the largest possible font size.
      function handleOrientationChange() {
        scheduleFit();
      }

      function setLandscapeState(enabled) {
        state.isLandscape = Boolean(enabled);
        if (rotatableContainer) {
          if (state.isLandscape) {
            rotatableContainer.classList.add('landscape-rotated');
          } else {
            rotatableContainer.classList.remove('landscape-rotated');
          }
        }
        if (landscapeBtn) {
          if (state.isLandscape) {
            landscapeBtn.classList.add('bg-white/20', 'border-white/35');
            landscapeBtn.style.borderColor = 'var(--accent-color)';
            landscapeBtn.style.color = 'var(--accent-color)';
          } else {
            landscapeBtn.classList.remove('bg-white/20', 'border-white/35');
            landscapeBtn.style.borderColor = '';
            landscapeBtn.style.color = '';
          }
        }
        if (landscapeIcon) {
          landscapeIcon.style.transform = state.isLandscape ? 'rotate(90deg)' : 'rotate(0deg)';
        }
        if (landscapeLabel) {
          landscapeLabel.textContent = state.isLandscape ? 'Portrait' : 'Landscape';
        }
        handleOrientationChange();
      }

      function setPulseState(enabled) {
        state.isPulseActive = Boolean(enabled);
        if (billboardStage) {
          if (state.isPulseActive) {
            billboardStage.classList.add('pulse-active');
          } else {
            billboardStage.classList.remove('pulse-active');
          }
        }
        if (pulseBtn) {
          if (state.isPulseActive) {
            pulseBtn.classList.add('bg-white/20');
            pulseBtn.style.borderColor = 'var(--accent-color)';
            pulseBtn.style.color = 'var(--accent-color)';
          } else {
            pulseBtn.classList.remove('bg-white/20');
            pulseBtn.style.borderColor = '';
            pulseBtn.style.color = '';
          }
        }
        if (pulseDot) {
          if (state.isPulseActive) {
            pulseDot.style.backgroundColor = 'var(--accent-color)';
            pulseDot.style.boxShadow = '0 0 10px var(--accent-glow)';
            pulseDot.classList.add('animate-pulse');
          } else {
            pulseDot.style.backgroundColor = '';
            pulseDot.style.boxShadow = '';
            pulseDot.classList.remove('animate-pulse');
          }
        }
      }

      // --- Preset Strip & Drawer Helpers ---
      function renderEditPresetsMenu() {
        if (!editPresetsList) return;
        editPresetsList.innerHTML = '';

        if (!state.presets.length) {
          const emptyMsg = document.createElement('p');
          emptyMsg.className = 'text-xs text-white/45 text-center py-4 px-2';
          emptyMsg.textContent = 'No presets left. Use + ADD PRESET to create one.';
          editPresetsList.appendChild(emptyMsg);
          return;
        }

        state.presets.forEach((phrase, idx) => {
          const itemRow = document.createElement('div');
          itemRow.className = 'flex items-center justify-between gap-2 px-2.5 py-2 rounded-xl hover:bg-white/5 transition';

          const labelEl = document.createElement('span');
          labelEl.className = 'truncate text-xs font-bold uppercase tracking-wide text-white/90';
          labelEl.textContent = phrase;

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.setAttribute('aria-label', `Remove preset ${phrase}`);
          removeBtn.title = 'Remove preset';
          removeBtn.className = 'shrink-0 p-1.5 rounded-lg text-white/50 hover:text-red-400 hover:bg-white/10 active:scale-95 transition';
          removeBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          `;
          removeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            removePresetAtIndex(idx);
          });

          itemRow.appendChild(labelEl);
          itemRow.appendChild(removeBtn);
          editPresetsList.appendChild(itemRow);
        });
      }

      function setEditPresetsMenuOpen(open) {
        isEditPresetsOpen = Boolean(open);
        if (!editPresetsMenu) return;
        if (isEditPresetsOpen) {
          renderEditPresetsMenu();
          editPresetsMenu.classList.remove('hidden');
        } else {
          editPresetsMenu.classList.add('hidden');
        }
      }

      function toggleEditPresetsMenu(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        setEditPresetsMenuOpen(!isEditPresetsOpen);
      }

      function renderPresets() {
        if (!presetStrip) return;
        presetStrip.innerHTML = '';

        const addChip = document.createElement('button');
        addChip.type = 'button';
        addChip.id = 'addPresetBtn';
        addChip.className = 'shrink-0 px-3.5 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-dashed text-xs font-extrabold uppercase tracking-wide transition';
        addChip.style.borderColor = 'var(--accent-color)';
        addChip.style.color = 'var(--accent-color)';
        addChip.textContent = '+ ADD PRESET';
        addChip.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          setEditPresetsMenuOpen(false);
          openAddPresetModal();
        });
        presetStrip.appendChild(addChip);

        state.presets.forEach((phrase) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition';
          chip.textContent = phrase;
          chip.addEventListener('click', () => {
            setEditPresetsMenuOpen(false);
            setMessageText(phrase);
            focusMessageInput();
          });
          presetStrip.appendChild(chip);
        });

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.id = 'editPresetsBtn';
        editBtn.className = 'shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/20 text-xs font-bold uppercase tracking-wide text-white/80 hover:text-white transition';
        editBtn.textContent = 'Edit Presets';
        editBtn.addEventListener('click', toggleEditPresetsMenu);
        presetStrip.appendChild(editBtn);
      }

      function openAddPresetModal() {
        if (!addPresetModal) return;
        addPresetModal.classList.remove('hidden');
        if (newPresetInput) {
          newPresetInput.value = '';
          setTimeout(() => {
            try {
              newPresetInput.focus({ preventScroll: true });
            } catch (err) {
              newPresetInput.focus();
            }
          }, 50);
        }
      }

      function closeAddPresetModal() {
        if (addPresetModal) addPresetModal.classList.add('hidden');
      }

      function openRecentDrawer() {
        if (!recentDrawer) return;
        renderRecentList();
        recentDrawer.classList.remove('hidden');
      }

      function closeRecentDrawer() {
        if (recentDrawer) recentDrawer.classList.add('hidden');
      }

      // --- Controls: Landscape, SHOW Mode, Pulse, Reply / Clear ---
      function toggleLandscape() {
        setLandscapeState(!state.isLandscape);
      }

      function enterShowMode() {
        const current = state.text.trim();
        let entryId = null;
        if (current || state.isCamArmed) {
          addToRecent(current, { allowPhotoOnly: state.isCamArmed });
          if (state.recent.length > 0) {
            entryId = state.recent[0].id;
          }
        }
        state.isShowMode = true;
        if (topBar) topBar.classList.add('hidden');
        if (bottomDock) bottomDock.classList.add('hidden');
        if (cornerGuides) cornerGuides.classList.add('opacity-0');
        if (billboardCaret) billboardCaret.style.visibility = 'hidden';
        if (showModeOverlayHint) showModeOverlayHint.classList.remove('hidden');
        scheduleFit();

        if (state.isCamArmed) {
          startReactionCountdown(entryId);
        }
      }

      function exitShowMode() {
        if (!state.isShowMode) return;
        clearPendingCamTimers();
        state.isShowMode = false;
        if (topBar) topBar.classList.remove('hidden');
        if (bottomDock) bottomDock.classList.remove('hidden');
        if (cornerGuides) cornerGuides.classList.remove('opacity-0');
        if (billboardCaret) billboardCaret.style.visibility = 'visible';
        if (showModeOverlayHint) showModeOverlayHint.classList.add('hidden');
        scheduleFit();
      }

      function togglePulse() {
        setPulseState(!state.isPulseActive);
      }

      function handleReplyClear() {
        if (state.isShowMode) {
          exitShowMode();
        }
        setMessageText('');
        focusMessageInput();
      }

      // --- Event Listeners ---
      if (messageInput) {
        messageInput.value = state.text;
        messageInput.addEventListener('input', (e) => {
          setMessageText(e.target.value, false);
        });
      }

      if (clearInputBtn) {
        clearInputBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setMessageText('');
          focusMessageInput();
        });
      }

      // Tapping billboard stage focuses input (or exits Show Mode first)
      if (billboardStage) {
        billboardStage.addEventListener('click', () => {
          if (state.isShowMode) {
            exitShowMode();
          }
          focusMessageInput();
        });

        billboardStage.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (state.isShowMode) {
              exitShowMode();
            }
            focusMessageInput();
          }
        });
      }

      if (typeBtn) {
        typeBtn.addEventListener('click', () => {
          if (state.isShowMode) {
            exitShowMode();
          }
          focusMessageInput();
        });
      }

      if (landscapeBtn) landscapeBtn.addEventListener('click', toggleLandscape);
      if (pulseBtn) pulseBtn.addEventListener('click', togglePulse);
      if (replyClearBtn) replyClearBtn.addEventListener('click', handleReplyClear);

      if (showModeBtn) showModeBtn.addEventListener('click', enterShowMode);
      if (reactionCamBtn) reactionCamBtn.addEventListener('click', toggleReactionCam);
      if (closePhotoModalBtn) closePhotoModalBtn.addEventListener('click', closePhotoPreview);
      if (photoPreviewModal) {
        photoPreviewModal.addEventListener('click', (e) => {
          if (e.target === photoPreviewModal) closePhotoPreview();
        });
      }
      if (exitShowModeBtn) {
        exitShowModeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          exitShowMode();
        });
      }

      if (recentBtn) recentBtn.addEventListener('click', openRecentDrawer);
      if (closeRecentBtn) closeRecentBtn.addEventListener('click', closeRecentDrawer);
      if (recentDrawer) {
        recentDrawer.addEventListener('click', (e) => {
          if (e.target === recentDrawer) closeRecentDrawer();
        });
      }
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => {
          if (!state.recent.length) return;
          openDeleteConfirmation({
            title: 'Are you sure?',
            message: `Clear all ${state.recent.length} recent message${state.recent.length === 1 ? '' : 's'} from your history?`,
            confirmLabel: 'Clear All',
            onConfirm: () => clearAllRecentItems(),
          });
        });
      }

      if (cancelDeleteBtn) {
        cancelDeleteBtn.addEventListener('click', closeDeleteConfirmation);
      }
      if (confirmDeleteBtn) {
        confirmDeleteBtn.addEventListener('click', () => {
          const action = pendingDeleteAction;
          closeDeleteConfirmation();
          if (action) action();
        });
      }
      if (confirmDeleteModal) {
        confirmDeleteModal.addEventListener('click', (e) => {
          if (e.target === confirmDeleteModal) closeDeleteConfirmation();
        });
      }
      if (closePresetModalBtn) closePresetModalBtn.addEventListener('click', closeAddPresetModal);
      if (cancelPresetBtn) cancelPresetBtn.addEventListener('click', closeAddPresetModal);
      if (addPresetModal) {
        addPresetModal.addEventListener('click', (e) => {
          if (e.target === addPresetModal) closeAddPresetModal();
        });
      }

      if (clearAllPresetsBtn) {
        clearAllPresetsBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!state.presets.length) return;
          setEditPresetsMenuOpen(false);
          openDeleteConfirmation({
            title: 'Clear all presets?',
            message: 'Remove all saved presets while keeping the + ADD PRESET button?',
            confirmLabel: 'Clear All',
            onConfirm: () => clearAllPresetsKeepAddButton(),
          });
        });
      }

      document.addEventListener('click', (e) => {
        if (!isEditPresetsOpen) return;
        const clickedInsideMenu = editPresetsMenu && editPresetsMenu.contains(e.target);
        const clickedEditBtn = e.target && e.target.id === 'editPresetsBtn';
        if (!clickedInsideMenu && !clickedEditBtn) {
          setEditPresetsMenuOpen(false);
        }
      });

      if (addPresetForm) {
        addPresetForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const phrase = newPresetInput ? newPresetInput.value.trim() : '';
          if (!phrase) return;
          state.presets.unshift(phrase);
          renderPresets();
          savePresetsToCloud();
          setMessageText(phrase);
          closeAddPresetModal();
          showToast('Preset chip saved');
        });
      }

      // Color swatch switcher
      colorSwatches.forEach((swatch) => {
        swatch.addEventListener('click', () => {
          const color = swatch.getAttribute('data-color');
          applyColorTheme(color);
        });
      });

      // Recalculate auto-scaling text on window resize, orientation change, and ResizeObserver
      window.addEventListener('resize', handleOrientationChange);
      window.addEventListener('orientationchange', handleOrientationChange);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleOrientationChange);
      }

      if (typeof ResizeObserver !== 'undefined') {
        const resizeObserver = new ResizeObserver(() => {
          scheduleFit();
        });
        resizeObserver.observe(billboardStage);
      }

      // --- Initial Render ---
      renderPresets();
      updateRecentBadge();
      renderRecentList();
      updateCaretVisibility();
      scheduleFit();

      function triggerFontReadyFit() {
        scheduleFit();
        if (document.fonts && document.fonts.load) {
          Promise.allSettled([
            document.fonts.load('700 48px "Atkinson Hyperlegible"'),
            document.fonts.load('400 16px "Atkinson Hyperlegible"'),
            document.fonts.load('700 16px "Lexend"'),
          ]).then(() => {
            scheduleFit();
          });
        }
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          triggerFontReadyFit();
        });
      } else {
        triggerFontReadyFit();
      }

      // --- Initialize Firebase Auth & Real-Time Firestore Sync ---
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          auth = getAuth(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const cred = await signInWithCustomToken(auth, __initial_auth_token);
            currentUser = cred.user;
          } else {
            const cred = await signInAnonymously(auth);
            currentUser = cred.user;
          }

          if (currentUser) {
            // Listen to all saved recent messages (no artificial cap)
            const recentColRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages');
            onSnapshot(
              recentColRef,
              (snapshot) => {
                const loaded = [];
                snapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  if (data && data.text) {
                    loaded.push({
                      id: docSnap.id,
                      text: data.text,
                      color: data.color || '#39FF14',
                      isPulseActive: Boolean(data.isPulseActive),
                      isLandscape: Boolean(data.isLandscape),
                      isPhotoOnly: Boolean(data.isPhotoOnly),
                      photo: data.photo || null,
                      updatedAt: Number(data.updatedAt) || 0,
                    });
                  }
                });
                // Sort newest-first in JavaScript memory
                loaded.sort((a, b) => b.updatedAt - a.updatedAt);
                state.recent = loaded;
                persistRecentLocally();
                updateRecentBadge();
                if (recentDrawer && !recentDrawer.classList.contains('hidden')) {
                  renderRecentList();
                }
              },
              (error) => {
                console.error('Error syncing recent messages:', error);
              }
            );

            // Listen to saved custom presets
            const prefsDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'preferences');
            onSnapshot(
              prefsDocRef,
              (docSnap) => {
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (Array.isArray(data.presets)) {
                    state.presets = data.presets.filter((p) => typeof p === 'string' && p.trim());
                    persistPresetsLocally();
                    renderPresets();
                    if (isEditPresetsOpen) {
                      renderEditPresetsMenu();
                    }
                  }
                }
              },
              (error) => {
                console.error('Error syncing presets:', error);
              }
            );
          }
        }
      } catch (err) {
        console.error('Cloud persistence initialization skipped or failed:', err);
      }
    })();
  </script>
</body>
</html>
