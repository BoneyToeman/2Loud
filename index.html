      // --- Dynamic Auto-Scaling Font Solver (Word-Aware Wrapping) ---
      function fitTextToBillboard() {
        try {
          if (!billboardStage || !rotatableContainer || !textFitBox || !billboardText || !billboardTextContent) {
            return;
          }

          const rawText = state.text;
          const trimmedText = rawText.trim();
          billboardTextContent.textContent = state.isShowMode ? trimmedText : rawText;

          if (!trimmedText) {
            if (emptyPrompt) emptyPrompt.classList.remove('hidden');
            billboardText.style.fontSize = '48px';
            billboardText.style.width = 'auto';
            billboardText.style.display = 'inline-block';
            updateCaretVisibility();
            return;
          }

          if (emptyPrompt) emptyPrompt.classList.add('hidden');

          const stageRect = billboardStage.getBoundingClientRect();
          if (!stageRect || stageRect.width <= 0 || stageRect.height <= 0) return;

          const horizontalPad = 24;
          const verticalPad = state.isShowMode ? 56 : 20;

          const stageWidth = stageRect.width;
          const stageHeight = stageRect.height;

          let availableWidth;
          let availableHeight;

          if (state.isLandscape) {
            rotatableContainer.style.width = `${stageHeight}px`;
            rotatableContainer.style.height = `${stageWidth}px`;
            availableWidth = Math.max(32, stageHeight - horizontalPad);
            availableHeight = Math.max(32, stageWidth - verticalPad);
          } else {
            rotatableContainer.style.width = `${stageWidth}px`;
            rotatableContainer.style.height = `${stageHeight}px`;
            availableWidth = Math.max(32, stageWidth - horizontalPad);
            availableHeight = Math.max(32, stageHeight - verticalPad);
          }

          textFitBox.style.width = `${availableWidth}px`;
          textFitBox.style.height = `${availableHeight}px`;

          billboardText.style.maxWidth = `${availableWidth}px`;
          billboardText.style.width = '100%';
          billboardText.style.display = 'block';
          billboardText.style.whiteSpace = 'normal';
          billboardText.style.wordBreak = 'keep-all';
          billboardText.style.overflowWrap = 'normal';
          billboardText.style.hyphens = 'none';

          if (billboardCaret) {
            if (state.isShowMode) {
              billboardCaret.style.display = 'none';
            }
            billboardCaret.style.visibility = 'hidden';
          }

          const minSize = 24;
          const maxSize = 420;
          let low = minSize;
          let high = maxSize;
          let bestSize = minSize;

          const prevTransition = rotatableContainer.style.transition;
          rotatableContainer.style.transition = 'none';

          while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            billboardText.style.fontSize = `${mid}px`;

            const textRect = billboardText.getBoundingClientRect();
            const measuredWidth = state.isLandscape ? textRect.height : textRect.width;
            const measuredHeight = state.isLandscape ? textRect.width : textRect.height;

            const fitsWidth =
              measuredWidth <= availableWidth + 0.5 &&
              billboardText.scrollWidth <= availableWidth + 1 &&
              textFitBox.scrollWidth <= availableWidth + 1;
            const fitsHeight =
              measuredHeight <= availableHeight + 0.5 &&
              billboardText.scrollHeight <= availableHeight + 1 &&
              textFitBox.scrollHeight <= availableHeight + 1;

            if (fitsWidth && fitsHeight) {
              bestSize = mid;
              low = mid + 1;
            } else {
              high = mid - 1;
            }
          }

          billboardText.style.fontSize = `${bestSize}px`;
          rotatableContainer.style.transition = prevTransition;
          updateCaretVisibility();
        } catch (err) {
          console.error('Error fitting text to billboard:', err);
        }
      }

      function scheduleFit() {
        if (fitRafId !== null) {
          cancelAnimationFrame(fitRafId);
        }
        fitRafId = requestAnimationFrame(() => {
          fitRafId = requestAnimationFrame(() => {
            fitTextToBillboard();
            fitRafId = null;
          });
        });
      }

      function handleOrientationChange() {
        scheduleFit();
      }

      function setLandscapeState(enabled) {
        state.isLandscape = Boolean(enabled);
        if (rotatableContainer) {
          if (state.isLandscape) {
            rotatableContainer.classList.add('landscape-rotated');
          } else {
            rotatableContainer.classList.remove('landscape-rotated');
          }
        }
        if (landscapeBtn) {
          if (state.isLandscape) {
            landscapeBtn.classList.add('bg-white/20', 'border-white/35');
            landscapeBtn.style.borderColor = 'var(--accent-color)';
            landscapeBtn.style.color = 'var(--accent-color)';
          } else {
            landscapeBtn.classList.remove('bg-white/20', 'border-white/35');
            landscapeBtn.style.borderColor = '';
            landscapeBtn.style.color = '';
          }
        }
        if (landscapeIcon) {
          landscapeIcon.style.transform = state.isLandscape ? 'rotate(90deg)' : 'rotate(0deg)';
        }
        if (landscapeLabel) {
          landscapeLabel.textContent = state.isLandscape ? 'Portrait' : 'Landscape';
        }
        handleOrientationChange();
      }

      // --- Preset Strip & Drawer Helpers ---
      function renderEditPresetsMenu() {
        if (!editPresetsList) return;
        editPresetsList.innerHTML = '';

        if (!state.presets.length) {
          editingPresetIndex = null;
          const emptyMsg = document.createElement('p');
          emptyMsg.className = 'text-xs text-white/45 text-center py-4 px-2';
          emptyMsg.textContent = 'No presets left. Use + ADD PRESET to create one.';
          editPresetsList.appendChild(emptyMsg);
          return;
        }

        state.presets.forEach((phrase, idx) => {
          const itemRow = document.createElement('div');
          itemRow.className = 'flex items-center justify-between gap-2 px-2 py-1.5 rounded-xl hover:bg-white/5 transition';

          if (editingPresetIndex === idx) {
            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.maxLength = 60;
            editInput.value = phrase;
            editInput.setAttribute('aria-label', `Edit preset ${phrase}`);
            editInput.className = 'flex-1 min-w-0 rounded-lg bg-black/70 border border-white/35 focus:border-[#FF9F43] focus:outline-none px-2.5 py-1.5 text-xs font-bold uppercase tracking-wide text-white caret-[#FF9F43]';

            let isCommitted = false;
            const commitEdit = () => {
              if (isCommitted) return;
              isCommitted = true;
              updatePresetAtIndex(idx, editInput.value);
            };

            editInput.addEventListener('click', (e) => {
              e.stopPropagation();
            });
            editInput.addEventListener('keydown', (e) => {
              e.stopPropagation();
              if (e.key === 'Enter') {
                e.preventDefault();
                commitEdit();
              } else if (e.key === 'Escape') {
                e.preventDefault();
                isCommitted = true;
                editingPresetIndex = null;
                renderEditPresetsMenu();
              }
            });
            editInput.addEventListener('blur', () => {
              commitEdit();
            });

            itemRow.appendChild(editInput);

            setTimeout(() => {
              try {
                editInput.focus({ preventScroll: true });
                const endPos = editInput.value.length;
                editInput.setSelectionRange(endPos, endPos);
              } catch (err) {
                editInput.focus();
              }
            }, 0);
          } else {
            const labelBtn = document.createElement('button');
            labelBtn.type = 'button';
            labelBtn.title = 'Tap to edit preset';
            labelBtn.className = 'flex-1 min-w-0 text-left px-1 py-1 rounded-lg text-xs font-bold uppercase tracking-wide text-white/90 hover:text-white truncate transition cursor-text';
            labelBtn.textContent = phrase;
            labelBtn.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              editingPresetIndex = idx;
              renderEditPresetsMenu();
            });
            itemRow.appendChild(labelBtn);
          }

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.setAttribute('aria-label', `Remove preset ${phrase}`);
          removeBtn.title = 'Remove preset';
          removeBtn.className = 'shrink-0 p-1.5 rounded-lg text-white/50 hover:text-red-400 hover:bg-white/10 active:scale-95 transition';
          removeBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          `;
          removeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            removePresetAtIndex(idx);
          });

          itemRow.appendChild(removeBtn);
          editPresetsList.appendChild(itemRow);
        });
      }

      function setEditPresetsMenuOpen(open) {
        isEditPresetsOpen = Boolean(open);
        if (!isEditPresetsOpen) {
          editingPresetIndex = null;
        }
        if (!editPresetsMenu) return;
        if (isEditPresetsOpen) {
          renderEditPresetsMenu();
          editPresetsMenu.classList.remove('hidden');
        } else {
          editPresetsMenu.classList.add('hidden');
        }
      }

      function toggleEditPresetsMenu(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        setEditPresetsMenuOpen(!isEditPresetsOpen);
      }

      function renderPresets() {
        if (!presetStrip) return;
        presetStrip.innerHTML = '';

        const addChip = document.createElement('button');
        addChip.type = 'button';
        addChip.id = 'addPresetBtn';
        addChip.className = 'shrink-0 px-3.5 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-dashed text-xs font-extrabold uppercase tracking-wide transition';
        addChip.style.borderColor = 'var(--accent-color)';
        addChip.style.color = 'var(--accent-color)';
        addChip.textContent = '+ ADD PRESET';
        addChip.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          setEditPresetsMenuOpen(false);
          openAddPresetModal();
        });
        presetStrip.appendChild(addChip);

        state.presets.forEach((phrase) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition';
          chip.textContent = phrase;
          chip.addEventListener('click', () => {
            setEditPresetsMenuOpen(false);
            setMessageText(phrase);
            focusMessageInput();
          });
          presetStrip.appendChild(chip);
        });

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.id = 'editPresetsBtn';
        editBtn.className = 'shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-[#FF9F43]/45 text-xs font-extrabold uppercase tracking-wide text-[#FF9F43] hover:text-[#FFB36B] transition';
        editBtn.textContent = 'Edit Presets';
        editBtn.addEventListener('click', toggleEditPresetsMenu);
        presetStrip.appendChild(editBtn);
      }

      function openAddPresetModal() {
        if (!addPresetModal) return;
        addPresetModal.classList.remove('hidden');
        if (newPresetInput) {
          newPresetInput.value = '';
          setTimeout(() => {
            try {
              newPresetInput.focus({ preventScroll: true });
            } catch (err) {
              newPresetInput.focus();
            }
          }, 50);
        }
      }

      function closeAddPresetModal() {
        if (addPresetModal) addPresetModal.classList.add('hidden');
      }

      function openRecentDrawer() {
        if (!recentDrawer) return;
        renderRecentList();
        recentDrawer.classList.remove('hidden');
      }

      function closeRecentDrawer() {
        if (recentDrawer) recentDrawer.classList.add('hidden');
      }

      // --- Controls: Landscape, SHOW Mode, Pulse, Reply / Clear ---
      function toggleLandscape() {
        setLandscapeState(!state.isLandscape);
      }

      function enterShowMode() {
        dismissStartupHint();
        const current = state.text.trim();
        let entryId = null;
        if (current || state.isCamArmed) {
          addToRecent(current, { allowPhotoOnly: state.isCamArmed });
          if (state.recent.length > 0) {
            entryId = state.recent[0].id;
          }
        }
        state.isShowMode = true;
        state.showModeEnteredAt = performance.now();
        if (topBar) topBar.classList.add('hidden');
        if (bottomDock) bottomDock.classList.add('hidden');
        if (cornerGuides) cornerGuides.classList.add('opacity-0');
        updateCaretVisibility();
        if (showModeOverlayHint) showModeOverlayHint.classList.remove('hidden');
        scheduleFit();

        if (state.isCamArmed) {
          startReactionCountdown(entryId);
        }
      }

      function exitShowMode() {
        if (!state.isShowMode) return;
        clearPendingCamTimers();
        const elapsedMs = state.showModeEnteredAt ? performance.now() - state.showModeEnteredAt : 0;
        state.isShowMode = false;
        state.showModeEnteredAt = 0;
        if (topBar) topBar.classList.remove('hidden');
        if (bottomDock) bottomDock.classList.remove('hidden');
        if (cornerGuides) cornerGuides.classList.remove('opacity-0');
        updateCaretVisibility();
        if (showModeOverlayHint) showModeOverlayHint.classList.add('hidden');

        if (elapsedMs >= 10000 && state.text.trim().length > 0) {
          setMessageText('');
          showToast('Message cleared after 10s in Show Mode');
        } else {
          scheduleFit();
        }
      }

      function togglePulse() {
        setPulseMenuOpen(false);
        setPulseState(!state.isPulseActive, state.pulseEffect);
      }

      function handleReplyClear() {
        if (state.isShowMode) {
          exitShowMode();
        }
        setMessageText('');
        focusMessageInput();
      }

      // --- Event Listeners ---
      if (messageInput) {
        messageInput.value = state.text;
        messageInput.addEventListener('focus', dismissStartupHint);
        messageInput.addEventListener('input', (e) => {
          dismissStartupHint();
          setMessageText(e.target.value, false);
        });
      }

      if (clearInputBtn) {
        clearInputBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setMessageText('');
          focusMessageInput();
        });
      }

      if (billboardStage) {
        billboardStage.addEventListener('click', () => {
          if (state.isShowMode) {
            exitShowMode();
          }
          focusMessageInput();
        });

        billboardStage.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (state.isShowMode) {
              exitShowMode();
            }
            focusMessageInput();
          }
        });
      }

      if (typeBtn) {
        typeBtn.addEventListener('click', () => {
          if (state.isShowMode) {
            exitShowMode();
          }
          focusMessageInput();
        });
      }

      if (landscapeBtn) landscapeBtn.addEventListener('click', toggleLandscape);
      if (pulseBtn) {
        const startHold = () => {
          cancelPulseLongPress();
          suppressNextPulseClick = false;
          pulseLongPressTimer = setTimeout(() => {
            suppressNextPulseClick = true;
            setPulseMenuOpen(!isPulseMenuOpen);
            showToast('Pulse effects menu');
          }, 420);
        };

        pulseBtn.addEventListener('mousedown', startHold);
        pulseBtn.addEventListener('touchstart', startHold, { passive: true });
        pulseBtn.addEventListener('mouseup', cancelPulseLongPress);
        pulseBtn.addEventListener('mouseleave', cancelPulseLongPress);
        pulseBtn.addEventListener('touchend', cancelPulseLongPress);
        pulseBtn.addEventListener('touchcancel', cancelPulseLongPress);
        pulseBtn.addEventListener('click', (e) => {
          cancelPulseLongPress();
          if (suppressNextPulseClick) {
            e.preventDefault();
            suppressNextPulseClick = false;
            return;
          }
          togglePulse();
        });
      }

      pulseEffectOptions.forEach((opt) => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          const eff = normalizePulseEffect(opt.getAttribute('data-effect'));
          setPulseState(true, eff);
          setPulseMenuOpen(false);
          showToast(`${formatPulseEffectLabel(eff)} active`);
        });
      });

      if (replyClearBtn) replyClearBtn.addEventListener('click', handleReplyClear);

      if (showModeBtn) showModeBtn.addEventListener('click', enterShowMode);
      if (reactionCamBtn) reactionCamBtn.addEventListener('click', toggleReactionCam);
      if (closePhotoModalBtn) closePhotoModalBtn.addEventListener('click', closePhotoPreview);
      if (photoPreviewModal) {
        photoPreviewModal.addEventListener('click', (e) => {
          if (e.target === photoPreviewModal) closePhotoPreview();
        });
      }
      if (exitShowModeBtn) {
        exitShowModeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          exitShowMode();
        });
      }

      if (recentBtn) recentBtn.addEventListener('click', openRecentDrawer);
      if (closeRecentBtn) closeRecentBtn.addEventListener('click', closeRecentDrawer);
      if (recentDrawer) {
        recentDrawer.addEventListener('click', (e) => {
          if (e.target === recentDrawer) closeRecentDrawer();
        });
      }
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => {
          if (!state.recent.length) return;
          openDeleteConfirmation({
            title: 'Are you sure?',
            message: `Clear all ${state.recent.length} recent message${state.recent.length === 1 ? '' : 's'} from your history?`,
            confirmLabel: 'Clear All',
            onConfirm: () => clearAllRecentItems(),
          });
        });
      }

      if (cancelDeleteBtn) {
        cancelDeleteBtn.addEventListener('click', closeDeleteConfirmation);
      }
      if (confirmDeleteBtn) {
        confirmDeleteBtn.addEventListener('click', () => {
          const action = pendingDeleteAction;
          closeDeleteConfirmation();
          if (action) action();
        });
      }
      if (confirmDeleteModal) {
        confirmDeleteModal.addEventListener('click', (e) => {
          if (e.target === confirmDeleteModal) closeDeleteConfirmation();
        });
      }
      if (closePresetModalBtn) closePresetModalBtn.addEventListener('click', closeAddPresetModal);
      if (cancelPresetBtn) cancelPresetBtn.addEventListener('click', closeAddPresetModal);
      if (addPresetModal) {
        addPresetModal.addEventListener('click', (e) => {
          if (e.target === addPresetModal) closeAddPresetModal();
        });
      }

      if (clearAllPresetsBtn) {
        clearAllPresetsBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!state.presets.length) return;
          setEditPresetsMenuOpen(false);
          openDeleteConfirmation({
            title: 'Clear all presets?',
            message: 'All presets will be permanently deleted. This action cannot be undone.',
            confirmLabel: 'Clear All',
            onConfirm: () => clearAllPresetsKeepAddButton(),
          });
        });
      }

      document.addEventListener('click', (e) => {
        if (isPulseMenuOpen) {
          const clickedInsidePulse =
            (pulseMenu && pulseMenu.contains(e.target)) ||
            (pulseBtn && pulseBtn.contains(e.target));
          if (!clickedInsidePulse) {
            setPulseMenuOpen(false);
          }
        }
        if (!isEditPresetsOpen) return;
        const clickedInsideMenu = editPresetsMenu && editPresetsMenu.contains(e.target);
        const clickedEditBtn = e.target && e.target.id === 'editPresetsBtn';
        if (!clickedInsideMenu && !clickedEditBtn) {
          setEditPresetsMenuOpen(false);
        }
      });

      if (addPresetForm) {
        addPresetForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const phrase = newPresetInput ? newPresetInput.value.trim() : '';
          if (!phrase) return;
          state.presets.unshift(phrase);
          renderPresets();
          savePresetsToCloud();
          setMessageText(phrase);
          closeAddPresetModal();
          showToast('Preset chip saved');
        });
      }

      colorSwatches.forEach((swatch) => {
        swatch.addEventListener('click', () => {
          const color = swatch.getAttribute('data-color');
          applyColorTheme(color);
        });
      });

      window.addEventListener('resize', handleOrientationChange);
      window.addEventListener('orientationchange', handleOrientationChange);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleOrientationChange);
      }

      if (typeof ResizeObserver !== 'undefined') {
        const resizeObserver = new ResizeObserver(() => {
          scheduleFit();
        });
        resizeObserver.observe(billboardStage);
      }

      // --- Initial Render ---
      renderPresets();
      updateRecentBadge();
      renderRecentList();
      updateMicBpmButtonUI();
      updateCaretVisibility();
      scheduleFit();

      function triggerFontReadyFit() {
        scheduleFit();
        if (document.fonts && document.fonts.load) {
          Promise.allSettled([
            document.fonts.load('700 48px "Atkinson Hyperlegible"'),
            document.fonts.load('400 16px "Atkinson Hyperlegible"'),
            document.fonts.load('700 16px "Lexend"'),
          ]).then(() => {
            scheduleFit();
          });
        }
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          triggerFontReadyFit();
        });
      } else {
        triggerFontReadyFit();
      }

      // --- Initialize Firebase Auth & Real-Time Firestore Sync ---
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          auth = getAuth(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const cred = await signInWithCustomToken(auth, __initial_auth_token);
            currentUser = cred.user;
          } else {
            const cred = await signInAnonymously(auth);
            currentUser = cred.user;
          }

          if (currentUser) {
            const recentColRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages');
            onSnapshot(
              recentColRef,
              (snapshot) => {
                const loaded = [];
                snapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  if (data && data.text) {
                    const isPulseActive = Boolean(data.isPulseActive);
                    loaded.push({
                      id: docSnap.id,
                      text: data.text,
                      color: data.color || '#39FF14',
                      isPulseActive,
                      pulseEffect: isPulseActive ? normalizePulseEffect(data.pulseEffect) : null,
                      isLandscape: Boolean(data.isLandscape),
                      isPhotoOnly: Boolean(data.isPhotoOnly),
                      photo: data.photo || null,
                      updatedAt: Number(data.updatedAt) || 0,
                    });
                  }
                });
                loaded.sort((a, b) => b.updatedAt - a.updatedAt);
                state.recent = loaded;
                persistRecentLocally();
                updateRecentBadge();
                if (recentDrawer && !recentDrawer.classList.contains('hidden')) {
                  renderRecentList();
                }
              },
              (error) => {
                console.error('Error syncing recent messages:', error);
              }
            );

            const prefsDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'preferences');
            onSnapshot(
              prefsDocRef,
              (docSnap) => {
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (Array.isArray(data.presets)) {
                    state.presets = data.presets.filter((p) => typeof p === 'string' && p.trim());
                    persistPresetsLocally();
                    renderPresets();
                    if (isEditPresetsOpen) {
                      renderEditPresetsMenu();
                    }
                  }
                }
              },
              (error) => {
                console.error('Error syncing presets:', error);
              }
            );
          }
        }
      } catch (err) {
        console.error('Cloud persistence initialization skipped or failed:', err);
      }
    })();
  </script>
</body>
</html>
