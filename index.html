<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2Loud — Concert & Venue Digital Billboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Atkinson Hyperlegible"', 'Lexend', 'sans-serif'],
            display: ['"Atkinson Hyperlegible"', 'Lexend', 'sans-serif'],
          },
          colors: {
            oled: '#000000',
            surface: '#0B0B0F',
            elevated: '#14141C',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --accent-color: #39FF14;
      --accent-glow: rgba(57, 255, 20, 0.42);
      --accent-soft: rgba(57, 255, 20, 0.14);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Atkinson Hyperlegible', 'Lexend', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Hide scrollbars on horizontal preset strip while keeping touch scroll smooth */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Neon text glow for dark venues */
    .billboard-text-glow {
      text-shadow: 0 0 28px var(--accent-glow), 0 0 8px var(--accent-soft);
    }

    /* Blinking typing caret on billboard */
    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .custom-caret {
      display: inline-block;
      width: 0.06em;
      min-width: 3px;
      height: 0.85em;
      background-color: var(--accent-color);
      margin-left: 0.06em;
      vertical-align: -0.06em;
      border-radius: 2px;
      animation: caretBlink 1s infinite;
    }

    /* Subtle eye-catching neon border pulse for dark rooms */
    @keyframes neonBorderPulse {
      0%, 100% {
        box-shadow: inset 0 0 18px 2px var(--accent-soft), 0 0 10px var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.14);
        border-radius: 34px;
      }
      50% {
        box-shadow: inset 0 0 46px 8px var(--accent-glow), 0 0 28px var(--accent-glow);
        border-color: var(--accent-color);
        border-radius: 34px;
      }
    }
    .pulse-active {
      border-radius: 34px !important;
      clip-path: inset(0 round 34px);
      animation: neonBorderPulse 1.6s ease-in-out infinite;
    }

    /* Quick-flash strobe effect across the billboard background */
    @keyframes strobeFlash {
      0%, 62% {
        background-color: #000000;
        box-shadow: inset 0 0 18px 2px rgba(255, 255, 255, 0.08);
        border-radius: 34px;
      }
      66%, 84% {
        background-color: var(--accent-soft);
        box-shadow: inset 0 0 56px 10px var(--accent-glow);
        border-radius: 34px;
      }
      88%, 100% {
        background-color: #000000;
        border-radius: 34px;
      }
    }
    .effect-strobe {
      border-radius: 34px !important;
      clip-path: inset(0 round 34px);
      animation: strobeFlash 0.52s ease-in-out infinite;
    }

    /* Double-beat lub-dub heartbeat border surge */
    @keyframes heartbeatSurge {
      0%, 100% {
        box-shadow: inset 0 0 12px 1px var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.14);
        border-radius: 34px;
      }
      14% {
        box-shadow: inset 0 0 42px 7px var(--accent-glow), 0 0 22px var(--accent-glow);
        border-color: var(--accent-color);
        border-radius: 34px;
      }
      28% {
        box-shadow: inset 0 0 14px 2px var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.22);
        border-radius: 34px;
      }
      42% {
        box-shadow: inset 0 0 54px 10px var(--accent-glow), 0 0 30px var(--accent-glow);
        border-color: var(--accent-color);
        border-radius: 34px;
      }
      62% {
        box-shadow: inset 0 0 12px 1px var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.14);
        border-radius: 34px;
      }
    }
    .effect-heartbeat {
      border-radius: 34px !important;
      clip-path: inset(0 round 34px);
      animation: heartbeatSurge 1.25s ease-out infinite;
    }

    /* Sweeping lighthouse-style corner beacon */
    @keyframes beaconSweep {
      0% {
        box-shadow: inset 24px 0 36px -8px var(--accent-glow);
        border-radius: 34px;
      }
      25% {
        box-shadow: inset 0 24px 36px -8px var(--accent-glow);
        border-radius: 34px;
      }
      50% {
        box-shadow: inset -24px 0 36px -8px var(--accent-glow);
        border-radius: 34px;
      }
      75% {
        box-shadow: inset 0 -24px 36px -8px var(--accent-glow);
        border-radius: 34px;
      }
      100% {
        box-shadow: inset 24px 0 36px -8px var(--accent-glow);
        border-radius: 34px;
      }
    }
    .effect-beacon {
      border-radius: 34px !important;
      clip-path: inset(0 round 34px);
      animation: beaconSweep 1.8s linear infinite;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Beat-driven background dance pulse (rate-limited for photosensitive safety) */
    .effect-bpm {
      border-radius: 34px !important;
      clip-path: inset(0 round 34px);
      transition: background-color 420ms ease-in-out, box-shadow 260ms ease-out, border-color 360ms ease-in-out;
    }
    .bpm-fill-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      border-radius: 34px;
      clip-path: inset(0 round 34px);
      background-color: var(--accent-color);
      transition: opacity 260ms ease-out, background-color 420ms ease-in-out;
    }
    .bpm-wave-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      border-radius: 34px;
      clip-path: inset(0 round 34px);
      transition: transform 240ms ease-out, opacity 260ms ease-out, background-color 420ms ease-in-out, box-shadow 280ms ease-out;
    }

    /* 90-degree landscape billboard rotation */
    .landscape-rotated {
      transform: rotate(90deg);
    }

    /* Custom subtle dark scrollbar inside Recent drawer */
    .drawer-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .drawer-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .drawer-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-black text-white font-sans select-none">
  <!-- App Shell: Full-height mobile-first frame centered nicely on desktop -->
  <div id="appShell" class="relative w-full h-full flex flex-col items-center justify-center bg-black md:p-4">
    <!-- Mobile Frame on Desktop / Full Viewport on Mobile -->
    <div id="deviceFrame" class="relative w-full h-full md:max-w-[440px] md:h-[92vh] md:max-h-[880px] flex flex-col bg-black md:rounded-[34px] md:border md:border-white/15 md:shadow-[0_25px_90px_rgba(0,0,0,0.95)] overflow-hidden">

      <!-- Top Header Bar -->
      <header id="topBar" class="relative z-20 shrink-0 flex items-center justify-between px-3 py-2.5 bg-surface/95 border-b border-white/10 backdrop-blur-md">
        <!-- Brand Mark & Color Swatch Picker -->
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow);"></span>
            <span class="font-display font-extrabold tracking-tight text-base text-white">2LOUD</span>
          </div>

          <!-- High-Contrast Color Swatches -->
          <div id="colorSwatches" class="flex items-center gap-1.5 pl-1" role="group" aria-label="Billboard text color">
            <button type="button" data-color="#39FF14" aria-label="Neon Green" class="color-swatch w-5 h-5 rounded-full bg-[#39FF14] ring-2 ring-white scale-105 transition-transform"></button>
            <button type="button" data-color="#FFFFFF" aria-label="Pure White" class="color-swatch w-5 h-5 rounded-full bg-[#FFFFFF] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#FFE600" aria-label="Electric Yellow" class="color-swatch w-5 h-5 rounded-full bg-[#FFE600] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#00F0FF" aria-label="Cyber Cyan" class="color-swatch w-5 h-5 rounded-full bg-[#00F0FF] opacity-75 hover:opacity-100 transition-opacity"></button>
            <button type="button" data-color="#FF2A85" aria-label="Hot Magenta" class="color-swatch w-5 h-5 rounded-full bg-[#FF2A85] opacity-75 hover:opacity-100 transition-opacity"></button>
          </div>
        </div>

        <!-- Top Right Actions: Recent Drawer, Reaction Cam & SHOW Mode -->
        <div class="flex items-center gap-2">
          <button id="recentBtn" type="button" class="relative flex items-center gap-1.5 px-3 py-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/10 text-xs font-semibold text-white/90 transition">
            <span>Recent</span>
            <span id="recentBadge" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-white/15 text-white">0</span>
          </button>

          <button id="reactionCamBtn" type="button" aria-label="Toggle Reaction Camera" title="Arm front camera for 3s reaction snapshot on SHOW" class="relative flex items-center justify-center p-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/10 text-white/85 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span id="camArmedDot" class="hidden absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-black"></span>
          </button>

          <button id="showModeBtn" type="button" class="px-3.5 py-2 rounded-xl font-display font-extrabold text-xs tracking-wider uppercase text-black active:scale-95 transition shadow-md" style="background-color: var(--accent-color);">
            SHOW
          </button>
        </div>
      </header>

      <!-- Main OLED Billboard Display Stage -->
      <main id="billboardStage" role="button" tabindex="0" aria-label="Tap to type message" class="relative flex-1 min-h-0 w-full bg-black flex items-center justify-center overflow-hidden border-2 border-transparent rounded-[34px] transition-colors duration-200 cursor-text">
        <!-- Dynamic decibel full-screen wash overlay for BPM mode -->
        <div id="bpmFillWash" class="bpm-fill-wash" aria-hidden="true"></div>
        <!-- BPM Visualizer Wave Layer -->
        <div id="bpmWaveLayer" class="bpm-wave-layer" aria-hidden="true"></div>

        <!-- Subtle 3s Reaction Cam Countdown Pill in Show Mode -->
        <div id="camCountdownPill" class="hidden pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/75 border border-white/15 backdrop-blur-md text-[11px] font-bold tracking-wide text-white/90">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
          <span id="camCountdownText">Reaction Cam in 3s...</span>
        </div>

        <!-- Subtle corner framing ticks (hidden in Show Mode) -->
        <div id="cornerGuides" class="pointer-events-none absolute inset-3 flex flex-col justify-between opacity-25 transition-opacity duration-200">
          <div class="flex justify-between">
            <span class="w-3 h-3 border-t-2 border-l-2 border-white/60 rounded-tl-sm"></span>
            <span class="w-3 h-3 border-t-2 border-r-2 border-white/60 rounded-tr-sm"></span>
          </div>
          <div class="flex justify-between">
            <span class="w-3 h-3 border-b-2 border-l-2 border-white/60 rounded-bl-sm"></span>
            <span class="w-3 h-3 border-b-2 border-r-2 border-white/60 rounded-br-sm"></span>
          </div>
        </div>

        <!-- Empty state prompt when message is cleared -->
        <div id="emptyPrompt" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-10 transition-opacity duration-200">
          <p class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight text-white/45">TAP TO TYPE</p>
          <p class="text-xs text-white/30 mt-1.5">Or pick a preset below</p>
        </div>

        <!-- Rotatable 90° Landscape Container -->
        <div id="rotatableContainer" class="flex items-center justify-center transition-transform duration-300 ease-out">
          <div id="textFitBox" class="w-full h-full flex items-center justify-center overflow-hidden">
            <div id="billboardText" class="font-bold uppercase tracking-tight leading-tight text-center billboard-text-glow transition-colors duration-150" style="font-family: 'Atkinson Hyperlegible', 'Lexend', sans-serif; color: var(--accent-color); font-size: 48px; word-break: keep-all; overflow-wrap: normal; hyphens: none;">
              <span id="billboardTextContent"></span><span id="billboardCaret" class="custom-caret" style="visibility: hidden;"></span>
            </div>
          </div>
        </div>

        <!-- Subtle floating exit hint in Show Mode -->
        <div id="showModeOverlayHint" class="hidden absolute bottom-2 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2">
          <button id="exitShowModeBtn" type="button" class="px-2.5 py-1 rounded-full bg-white/[0.07] hover:bg-white/20 active:scale-95 backdrop-blur-sm border border-white/10 text-[10px] font-semibold uppercase tracking-wider text-white/45 hover:text-white/90 transition">
            Exit Show Mode
          </button>
        </div>
      </main>

      <!-- Hidden video & canvas elements for silent front-camera reaction capture -->
      <video id="reactionVideo" playsinline muted class="hidden"></video>
      <canvas id="reactionCanvas" class="hidden"></canvas>

      <!-- Bottom Control Dock: Presets, Action Bar & Fast Input -->
      <section id="bottomDock" class="relative z-20 shrink-0 flex flex-col gap-2 px-3 pt-2 pb-3 bg-surface/95 border-t border-white/10 backdrop-blur-md">
        <!-- Horizontal Preset Strip + '+ Add Preset' + 'Edit Presets' -->
        <div class="relative">
          <div id="presetStrip" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" aria-label="Quick venue presets">
            <button type="button" data-preset="LOUDER PLEASE 🔊" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">LOUDER PLEASE 🔊</button>
            <button type="button" data-preset="WHAT DID YOU SAY? 👂" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">WHAT DID YOU SAY? 👂</button>
            <button type="button" data-preset="OVER HERE! 👋" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">OVER HERE! 👋</button>
            <button type="button" data-preset="GREAT SET! 🙌" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">GREAT SET! 🙌</button>
            <button type="button" data-preset="NEED WATER 💧" class="shrink-0 px-3 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold uppercase tracking-wide text-white/90 transition">NEED WATER 💧</button>
            <button id="addPresetBtn" type="button" style="border-color: var(--accent-color); color: var(--accent-color);" class="shrink-0 px-3.5 py-1.5 rounded-full bg-elevated hover:bg-white/15 active:scale-95 border border-dashed text-xs font-extrabold uppercase tracking-wide transition">+ ADD PRESET</button>
          </div>

          <!-- Edit Presets Dropdown Menu -->
          <div id="editPresetsMenu" class="hidden absolute bottom-full right-0 mb-2 z-30 w-64 max-w-[calc(100vw-2rem)] rounded-2xl bg-surface border border-white/15 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-white/10 bg-elevated/70">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-white/80">Edit Presets</span>
              <button id="clearAllPresetsBtn" type="button" class="px-2 py-1 rounded-lg bg-red-500/15 hover:bg-red-500/25 active:scale-95 text-[11px] font-extrabold uppercase tracking-wide text-red-400 transition">
                Clear All
              </button>
            </div>
            <div id="editPresetsList" class="max-h-52 overflow-y-auto drawer-scroll divide-y divide-white/10 p-1.5"></div>
          </div>
        </div>

        <!-- Fast Message Input Box -->
        <div class="relative flex items-center">
          <input id="messageInput" type="text" maxlength="160" placeholder="Type loud message here..." autocomplete="off" autocapitalize="characters" spellcheck="true" aria-label="Message input" class="w-full rounded-2xl bg-elevated border border-white/15 focus:border-white/40 focus:outline-none pl-4 pr-11 py-2.5 text-sm font-bold uppercase tracking-wide text-white placeholder:text-white/35 placeholder:normal-case placeholder:font-normal transition" />
          <button id="clearInputBtn" type="button" aria-label="Clear message input" class="absolute right-2 p-1.5 rounded-xl text-white/50 hover:text-white hover:bg-white/10 active:scale-95 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Primary Action Row: Type, Landscape, Pulse, Reply / Clear -->
        <div class="grid grid-cols-4 gap-2">
          <button id="typeBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
            </svg>
            <span>Type</span>
          </button>

          <button id="landscapeBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
            <svg id="landscapeIcon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"></rect>
              <path d="M12 18h.01"></path>
            </svg>
            <span id="landscapeLabel">Landscape</span>
          </button>

          <button id="pulseBtn" type="button" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-elevated hover:bg-white/15 active:scale-95 border border-white/12 text-xs font-bold text-white transition">
            <span id="pulseDot" class="w-2.5 h-2.5 rounded-full bg-white/40 transition"></span>
            <span id="pulseBtnLabel">Pulse</span>
          </button>

          <button id="replyClearBtn" type="button" class="flex items-center justify-center gap-1 py-2.5 px-2 rounded-xl bg-white/12 hover:bg-white/20 active:scale-95 border border-white/15 text-xs font-extrabold text-white transition">
            <span>Reply / Clear</span>
          </button>
        </div>

        <!-- Long-Press Pulse Effects Dropdown Menu -->
        <div id="pulseMenu" class="hidden absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-30 w-60 rounded-2xl bg-surface border border-white/15 shadow-2xl overflow-hidden">
          <div class="flex items-center justify-between px-3.5 py-2 border-b border-white/10 bg-elevated/70">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-white/80">Pulse Effects</span>
          </div>
          <div id="pulseMenuOptions" class="p-1.5 space-y-1">
            <button type="button" data-effect="pulse" class="pulse-effect-option w-full flex items-center justify-between px-3 py-2 rounded-xl text-left hover:bg-white/10 transition">
              <div>
                <div class="text-xs font-extrabold uppercase tracking-wide text-white">Pulse</div>
                <div class="text-[10px] text-white/50">Steady neon border glow</div>
              </div>
              <span class="effect-check text-[10px] font-extrabold uppercase hidden">Active</span>
            </button>
            <button type="button" data-effect="strobe" class="pulse-effect-option w-full flex items-center justify-between px-3 py-2 rounded-xl text-left hover:bg-white/10 transition">
              <div>
                <div class="text-xs font-extrabold uppercase tracking-wide text-white">Strobe</div>
                <div class="text-[10px] text-white/50">Rapid background flash</div>
              </div>
              <span class="effect-check text-[10px] font-extrabold uppercase hidden">Active</span>
            </button>
            <button type="button" data-effect="heartbeat" class="pulse-effect-option w-full flex items-center justify-between px-3 py-2 rounded-xl text-left hover:bg-white/10 transition">
              <div>
                <div class="text-xs font-extrabold uppercase tracking-wide text-white">Heartbeat</div>
                <div class="text-[10px] text-white/50">Double-beat lub-dub surge</div>
              </div>
              <span class="effect-check text-[10px] font-extrabold uppercase hidden">Active</span>
            </button>
            <button type="button" data-effect="beacon" class="pulse-effect-option w-full flex items-center justify-between px-3 py-2 rounded-xl text-left hover:bg-white/10 transition">
              <div>
                <div class="text-xs font-extrabold uppercase tracking-wide text-white">Beacon</div>
                <div class="text-[10px] text-white/50">Sweeping edge spotlight</div>
              </div>
              <span class="effect-check text-[10px] font-extrabold uppercase hidden">Active</span>
            </button>
            <button type="button" data-effect="bpm" class="pulse-effect-option w-full flex items-center justify-between px-3 py-2 rounded-xl text-left hover:bg-white/10 transition">
              <div>
                <div id="bpmMenuOptionLabel" class="text-xs font-extrabold uppercase tracking-wide text-white">BPM</div>
                <div class="text-[10px] text-white/50">Background dances to music beat</div>
              </div>
              <span class="effect-check text-[10px] font-extrabold uppercase hidden">Active</span>
            </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    (async () => {
      const DEFAULT_PRESETS = [
        'LOUDER PLEASE 🔊',
        'WHAT DID YOU SAY? 👂',
        'OVER HERE! 👋',
        'GREAT SET! 🙌',
        'NEED WATER 💧',
      ];

      const COLOR_THEMES = {
        '#39FF14': { glow: 'rgba(57, 255, 20, 0.42)', soft: 'rgba(57, 255, 20, 0.14)' },
        '#FFFFFF': { glow: 'rgba(255, 255, 255, 0.35)', soft: 'rgba(255, 255, 255, 0.12)' },
        '#FFE600': { glow: 'rgba(255, 230, 0, 0.42)', soft: 'rgba(255, 230, 0, 0.14)' },
        '#00F0FF': { glow: 'rgba(0, 240, 255, 0.42)', soft: 'rgba(0, 240, 255, 0.14)' },
        '#FF2A85': { glow: 'rgba(255, 42, 133, 0.42)', soft: 'rgba(255, 42, 133, 0.14)' },
      };

      // Each swatch cycles through its chosen color, its color-wheel secondary color, and white
      const BPM_PALETTES_BY_COLOR = {
        '#39FF14': ['#39FF14', '#C82AFF', '#FFFFFF'],
        '#FFFFFF': ['#FFFFFF', '#000000', '#FFFFFF'],
        '#FFE600': ['#FFE600', '#5B21FF', '#FFFFFF'],
        '#00F0FF': ['#00F0FF', '#A855F7', '#FFFFFF'],
        '#FF2A85': ['#FF2A85', '#00F59B', '#FFFFFF'],
      };

      const VALID_PULSE_EFFECTS = ['pulse', 'strobe', 'heartbeat', 'beacon', 'bpm'];

      function normalizePulseEffect(effectName) {
        return VALID_PULSE_EFFECTS.includes(effectName) ? effectName : 'pulse';
      }

      function formatPulseEffectLabel(effectName) {
        const normalized = normalizePulseEffect(effectName);
        if (normalized === 'bpm') return 'BPM';
        return normalized.charAt(0).toUpperCase() + normalized.slice(1);
      }

      const LOCAL_RECENT_KEY = '2loud_recent_v1';
      const LOCAL_PRESETS_KEY = '2loud_presets_v1';

      // --- Application State ---
      const state = {
        text: '',
        presets: [...DEFAULT_PRESETS],
        recent: [],
        activeColor: '#39FF14',
        isLandscape: false,
        isShowMode: false,
        showModeEnteredAt: 0,
        isPulseActive: false,
        pulseEffect: 'pulse',
        isCamArmed: false,
        hasUserTappedToType: false,
        hasDismissedStartupHint: false,
      };

      // --- Firestore & Local Persistence Setup ---
      let db = null;
      let auth = null;
      let currentUser = null;
      const appId = typeof __app_id !== 'undefined' ? __app_id : '2loud-default-app';

      function loadLocalStorageFallback() {
        try {
          const rawRecent = localStorage.getItem(LOCAL_RECENT_KEY);
          if (rawRecent) {
            const parsedRecent = JSON.parse(rawRecent);
            if (Array.isArray(parsedRecent)) {
              state.recent = parsedRecent
                .filter((item) => item && typeof item.text === 'string' && item.text.trim())
                .map((item) => {
                  const isPulseActive = Boolean(item.isPulseActive);
                  return {
                    id: item.id || `msg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    text: item.text,
                    color: item.color || '#39FF14',
                    isPulseActive,
                    pulseEffect: isPulseActive ? normalizePulseEffect(item.pulseEffect) : null,
                    isLandscape: Boolean(item.isLandscape),
                    isPhotoOnly: Boolean(item.isPhotoOnly),
                    photo: item.photo || null,
                    updatedAt: Number(item.updatedAt) || 0,
                  };
                })
                .sort((a, b) => b.updatedAt - a.updatedAt);
            }
          }
        } catch (err) {
          console.error('Error reading recent history from localStorage:', err);
        }

        try {
          const rawPresets = localStorage.getItem(LOCAL_PRESETS_KEY);
          if (rawPresets) {
            const parsedPresets = JSON.parse(rawPresets);
            if (Array.isArray(parsedPresets) && parsedPresets.length > 0) {
              state.presets = parsedPresets.filter((p) => typeof p === 'string' && p.trim());
            }
          }
        } catch (err) {
          console.error('Error reading presets from localStorage:', err);
        }
      }

      function persistRecentLocally() {
        try {
          localStorage.setItem(LOCAL_RECENT_KEY, JSON.stringify(state.recent));
        } catch (err) {
          try {
            const stripped = state.recent.map(({ photo, ...rest }) => ({ ...rest, photo: null }));
            localStorage.setItem(LOCAL_RECENT_KEY, JSON.stringify(stripped));
          } catch (fallbackErr) {
            console.error('Error saving recent history to localStorage:', fallbackErr);
          }
        }
      }

      function persistPresetsLocally() {
        try {
          localStorage.setItem(LOCAL_PRESETS_KEY, JSON.stringify(state.presets));
        } catch (err) {
          console.error('Error saving presets to localStorage:', err);
        }
      }

      loadLocalStorageFallback();

      // --- DOM Element References ---
      const topBar = document.getElementById('topBar');
      const billboardStage = document.getElementById('billboardStage');
      const cornerGuides = document.getElementById('cornerGuides');
      const emptyPrompt = document.getElementById('emptyPrompt');

      const bottomDock = document.getElementById('bottomDock');

      const recentList = document.getElementById('recentList');

      const reactionCamBtn = document.getElementById('reactionCamBtn');
      const camArmedDot = document.getElementById('camArmedDot');
      const camCountdownPill = document.getElementById('camCountdownPill');
      const camCountdownText = document.getElementById('camCountdownText');
      const reactionVideo = document.getElementById('reactionVideo');
      const reactionCanvas = document.getElementById('reactionCanvas');

      const photoPreviewImg = document.getElementById('photoPreviewImg');
      const photoPreviewCaption = document.getElementById('photoPreviewCaption');
      const downloadPhotoBtn = document.getElementById('downloadPhotoBtn');
      const closePhotoModalBtn = document.getElementById('closePhotoModalBtn');

      const addPresetModal = document.getElementById('addPresetModal');
      const closePresetModalBtn = document.getElementById('closePresetModalBtn');
      const cancelPresetBtn = document.getElementById('cancelPresetBtn');
      const addPresetForm = document.getElementById('addPresetForm');
      const newPresetInput = document.getElementById('newPresetInput');

      const confirmDeleteModal = document.getElementById('confirmDeleteModal');
      const confirmDeleteTitle = document.getElementById('confirmDeleteTitle');
      const confirmDeleteMessage = document.getElementById('confirmDeleteMessage');
      const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
      const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

      const colorSwatches = document.querySelectorAll('.color-swatch');
      const toastBanner = document.getElementById('toastBanner');

      let toastTimeout = null;
      let pendingDeleteAction = null;
      let fitRafId = null;
      let camStream = null;
      let camCountdownTimer = null;
      let camCaptureTimeout = null;
      let isEditPresetsOpen = false;
      let editingPresetIndex = null;
      let isPulseMenuOpen = false;
      let pulseLongPressTimer = null;
      let suppressNextPulseClick = false;

      // BPM audio & animation state
      // Visual caps keep luminance pulses < 2 Hz and color shifts <= ~1.2 Hz (below WCAG 2.3.1 3-flashes/sec threshold)
      const BPM_VISUAL_PULSE_COOLDOWN_MS = 520;
      const BPM_COLOR_CHANGE_COOLDOWN_MS = 850;
      let isMicListening = false;
      let micStarting = false;
      let micAudioCtx = null;
      let micStream = null;
      let micSourceNode = null;
      let micAnalyser = null;
      let micTimeData = null;
      let micRafId = null;
      let micPeakTimes = [];
      let micLastPeakMs = 0;
      let micDetectedBpm = null;
      let bpmColorIndex = 0;
      let bpmDecayTimer = null;
      let bpmLastVisualPulseMs = 0;
      let bpmLastColorChangeMs = 0;
      let bpmSmoothedLevel = 0;

      function showToast(message) {
        if (!toastBanner || !message) return;
        toastBanner.textContent = message;
        toastBanner.classList.remove('opacity-0', 'translate-y-2');
        toastBanner.classList.add('opacity-100', 'translate-y-0');

        if (toastTimeout) {
          clearTimeout(toastTimeout);
        }
        toastTimeout = setTimeout(() => {
          toastBanner.classList.remove('opacity-100', 'translate-y-0');
          toastBanner.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      }

      function dismissStartupHint() {
        if (!state.hasDismissedStartupHint) {
          state.hasDismissedStartupHint = true;
          if (emptyPrompt) {
            emptyPrompt.classList.add('opacity-0');
          }
        }
      }

      function focusMessageInput() {
        state.hasUserTappedToType = true;
        dismissStartupHint();
        updateCaretVisibility();
        if (!messageInput) return;
        try {
          messageInput.focus({ preventScroll: true });
        } catch (err) {
          messageInput.focus();
        }
      }

      function getCurrentBpmPaletteColor() {
        const palette = BPM_PALETTES_BY_COLOR[state.activeColor] || BPM_PALETTES_BY_COLOR['#39FF14'];
        return palette[bpmColorIndex % palette.length];
      }

      function resetBpmVisuals() {
        bpmSmoothedLevel = 0;
        if (bpmDecayTimer) {
          clearTimeout(bpmDecayTimer);
          bpmDecayTimer = null;
        }
        if (bpmFillWash) {
          bpmFillWash.style.opacity = '0';
          bpmFillWash.style.backgroundColor = 'var(--accent-color)';
        }
        if (bpmWaveLayer) {
          bpmWaveLayer.style.opacity = '0';
          bpmWaveLayer.style.transform = 'scale(1)';
          bpmWaveLayer.style.backgroundColor = 'transparent';
          bpmWaveLayer.style.boxShadow = 'none';
        }
      }

      function renderBpmFrame(level, isPulseHit, options = {}) {
        if (!state.isPulseActive || state.pulseEffect !== 'bpm' || !billboardStage) return;

        const prefersReducedMotion =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const nowMs = performance.now();
        const force = Boolean(options.force);

        const allowVisualHit =
          isPulseHit &&
          !prefersReducedMotion &&
          (force || nowMs - bpmLastVisualPulseMs >= BPM_VISUAL_PULSE_COOLDOWN_MS);

        if (allowVisualHit) {
          bpmLastVisualPulseMs = nowMs;
        }

        if (
          isPulseHit &&
          !prefersReducedMotion &&
          (force || nowMs - bpmLastColorChangeMs >= BPM_COLOR_CHANGE_COOLDOWN_MS)
        ) {
          bpmColorIndex = (bpmColorIndex + 1) % 3;
          bpmLastColorChangeMs = nowMs;
        } else if (force) {
          bpmLastColorChangeMs = nowMs;
        }

        const layerColor = getCurrentBpmPaletteColor();
        const clamped = Math.max(0, Math.min(1, level));
        const activeScale = prefersReducedMotion
          ? 1
          : 1 + clamped * 0.02 + (allowVisualHit ? 0.015 : 0);
        const glowBlur = prefersReducedMotion
          ? 18
          : Math.round(14 + clamped * 28 + (allowVisualHit ? 10 : 0));

        billboardStage.style.borderRadius = '34px';
        billboardStage.style.clipPath = 'inset(0 round 34px)';
        billboardStage.style.borderColor = allowVisualHit || clamped > 0.25 ? layerColor : 'rgba(255, 255, 255, 0.14)';
        billboardStage.style.boxShadow = `inset 0 0 ${glowBlur}px ${Math.round(4 + clamped * 5)}px ${layerColor}`;

        if (bpmFillWash) {
          bpmFillWash.style.backgroundColor = layerColor;
          const washOpacity = prefersReducedMotion
            ? 0.06
            : allowVisualHit
              ? Math.min(0.14, 0.06 + clamped * 0.08)
              : Math.min(0.08, 0.03 + clamped * 0.05);
          bpmFillWash.style.opacity = washOpacity.toFixed(3);
        }

        if (bpmWaveLayer) {
          bpmWaveLayer.style.backgroundColor = layerColor;
          bpmWaveLayer.style.boxShadow = `inset 0 0 ${glowBlur}px ${layerColor}`;
          bpmWaveLayer.style.transform = `scale(${activeScale.toFixed(4)})`;
          const waveOpacity = prefersReducedMotion
            ? 0.04
            : allowVisualHit
              ? Math.min(0.18, 0.07 + clamped * 0.11)
              : Math.min(0.08, clamped * 0.08);
          bpmWaveLayer.style.opacity = waveOpacity.toFixed(3);
        }

        if (bpmDecayTimer) {
          clearTimeout(bpmDecayTimer);
        }
        bpmDecayTimer = setTimeout(() => {
          if (!state.isPulseActive || state.pulseEffect !== 'bpm') return;
          if (bpmFillWash) bpmFillWash.style.opacity = '0.035';
          if (bpmWaveLayer) {
            bpmWaveLayer.style.opacity = '0';
            bpmWaveLayer.style.transform = 'scale(1)';
          }
          billboardStage.style.boxShadow = 'inset 0 0 14px 2px var(--accent-soft)';
          billboardStage.style.borderColor = 'rgba(255, 255, 255, 0.14)';
        }, 320);
      }

      function setPulseState(enabled, effectName = null) {
        if (effectName && VALID_PULSE_EFFECTS.includes(effectName)) {
          state.pulseEffect = effectName;
        }
        state.isPulseActive = Boolean(enabled);

        const shouldUseBpmMic = state.isPulseActive && state.pulseEffect === 'bpm';
        if (shouldUseBpmMic) {
          bpmColorIndex = 0;
          if (!isMicListening && !micStarting) {
            startMicBpmDetection();
          }
        } else if (isMicListening || micStarting) {
          stopMicBpmDetection(true);
        }

        resetBpmVisuals();

        if (billboardStage) {
          billboardStage.classList.remove('pulse-active', 'effect-strobe', 'effect-heartbeat', 'effect-beacon', 'effect-bpm');
          billboardStage.style.backgroundColor = '';
          billboardStage.style.boxShadow = '';
          billboardStage.style.borderColor = '';
          billboardStage.style.borderRadius = '34px';
          billboardStage.style.clipPath = 'inset(0 round 34px)';
          if (state.isPulseActive) {
            if (state.pulseEffect === 'strobe') {
              billboardStage.style.backgroundColor = '#000000';
              void billboardStage.offsetWidth;
              billboardStage.classList.add('effect-strobe');
            } else if (state.pulseEffect === 'heartbeat') {
              void billboardStage.offsetWidth;
              billboardStage.classList.add('effect-heartbeat');
            } else if (state.pulseEffect === 'beacon') {
              void billboardStage.offsetWidth;
              billboardStage.classList.add('effect-beacon');
            } else if (state.pulseEffect === 'bpm') {
              billboardStage.style.backgroundColor = '#000000';
              void billboardStage.offsetWidth;
              billboardStage.classList.add('effect-bpm');
              bpmLastVisualPulseMs = 0;
              bpmLastColorChangeMs = 0;
              renderBpmFrame(0.15, false, { force: true });
            } else if (state.pulseEffect === 'pulse') {
              void billboardStage.offsetWidth;
              billboardStage.classList.add('pulse-active');
            }
          }
        }

        if (pulseBtnLabel) {
          if (state.pulseEffect === 'bpm') {
            pulseBtnLabel.textContent = micDetectedBpm ? `${micDetectedBpm} BPM` : 'BPM';
          } else {
            pulseBtnLabel.textContent = formatPulseEffectLabel(state.pulseEffect);
          }
        }

        if (pulseBtn) {
          if (state.isPulseActive) {
            pulseBtn.classList.add('bg-white/20');
            pulseBtn.style.borderColor = 'var(--accent-color)';
            pulseBtn.style.color = 'var(--accent-color)';
          } else {
            pulseBtn.classList.remove('bg-white/20');
            pulseBtn.style.borderColor = '';
            pulseBtn.style.color = '';
          }
        }

        if (pulseDot) {
          if (state.isPulseActive) {
            pulseDot.style.backgroundColor = 'var(--accent-color)';
            pulseDot.style.boxShadow = '0 0 10px var(--accent-glow)';
            pulseDot.classList.add('animate-pulse');
          } else {
            pulseDot.style.backgroundColor = '';
            pulseDot.style.boxShadow = '';
            pulseDot.classList.remove('animate-pulse');
          }
        }

        pulseEffectOptions.forEach((opt) => {
          const eff = opt.getAttribute('data-effect');
          const check = opt.querySelector('.effect-check');
          const isSelected = eff === state.pulseEffect;
          if (isSelected) {
            opt.classList.add('bg-white/12');
            opt.style.color = state.isPulseActive ? 'var(--accent-color)' : '';
            if (check) {
              check.textContent = state.isPulseActive ? 'Active' : 'Selected';
              check.classList.remove('hidden');
              check.style.color = state.isPulseActive ? 'var(--accent-color)' : 'rgba(255, 255, 255, 0.55)';
            }
          } else {
            opt.classList.remove('bg-white/12');
            opt.style.color = '';
            if (check) check.classList.add('hidden');
          }
        });
      }

      function setPulseMenuOpen(open) {
        isPulseMenuOpen = Boolean(open);
        if (!pulseMenu) return;
        if (isPulseMenuOpen) {
          setPulseState(state.isPulseActive, state.pulseEffect);
          pulseMenu.classList.remove('hidden');

      function updateCaretVisibility() {

      // --- Theme & Reaction Camera Helpers ---
      function applyColorTheme(hexColor) {
        const theme = COLOR_THEMES[hexColor] || COLOR_THEMES['#39FF14'];
        state.activeColor = hexColor;
        document.documentElement.style.setProperty('--accent-color', hexColor);
        document.documentElement.style.setProperty('--accent-glow', theme.glow);
        document.documentElement.style.setProperty('--accent-soft', theme.soft);

        colorSwatches.forEach((btn) => {
          const btnColor = btn.getAttribute('data-color');
          if (btnColor === hexColor) {
            btn.classList.add('ring-2', 'ring-white', 'scale-105');
            btn.classList.remove('opacity-75');
          } else {
            btn.classList.remove('ring-2', 'ring-white', 'scale-105');
            btn.classList.add('opacity-75');
          }
        });

        if (state.isPulseActive && state.pulseEffect === 'bpm') {
          bpmColorIndex = 0;
          bpmLastColorChangeMs = 0;
          bpmLastVisualPulseMs = 0;
          renderBpmFrame(0.25, false, { force: true });
        }
      }

      function clearPendingCamTimers() {
        if (camCountdownTimer) {
          clearInterval(camCountdownTimer);
          camCountdownTimer = null;
        }
        if (camCaptureTimeout) {
          clearTimeout(camCaptureTimeout);
          camCaptureTimeout = null;
        }
        if (camCountdownPill) {
          camCountdownPill.classList.add('hidden');

      function updateCamButtonUI() {
        if (!reactionCamBtn) return;
        if (state.isCamArmed) {
          reactionCamBtn.style.borderColor = 'var(--accent-color)';
          reactionCamBtn.style.color = 'var(--accent-color)';
          if (camArmedDot) camArmedDot.classList.remove('hidden');
        } else {

          if (camArmedDot) camArmedDot.classList.add('hidden');

      function updateMicBpmButtonUI() {
        if (bpmMenuOptionLabel) {
          if (isMicListening && micDetectedBpm) {
            bpmMenuOptionLabel.textContent = `BPM · ${micDetectedBpm}`;
          } else if (isMicListening) {
            bpmMenuOptionLabel.textContent = 'BPM · Listening';
          } else {
            bpmMenuOptionLabel.textContent = 'BPM';
          }
        }
        if (pulseBtnLabel && state.pulseEffect === 'bpm') {
          pulseBtnLabel.textContent = micDetectedBpm ? `${micDetectedBpm} BPM` : 'BPM';
        }
      }

      function processMicBeatFrame() {
        if (!isMicListening || !micAnalyser || !micTimeData) return;

        micAnalyser.getByteTimeDomainData(micTimeData);

        let sumSq = 0;
        for (let i = 0; i < micTimeData.length; i++) {
          const centered = (micTimeData[i] - 128) / 128;
          sumSq += centered * centered;
        }
        const rms = Math.sqrt(sumSq / micTimeData.length);
        const normalizedLevel = Math.max(0, Math.min(1, rms * 5.5));

        const nowMs = performance.now();
        const isPulseHit = rms > 0.045 && nowMs - micLastPeakMs >= 260;

        if (isPulseHit) {
          micLastPeakMs = nowMs;
          micPeakTimes.push(nowMs);
          if (micPeakTimes.length > 16) {
            micPeakTimes.shift();
          }

          if (micPeakTimes.length >= 3) {
            const intervals = [];
            for (let i = 1; i < micPeakTimes.length; i++) {
              const dt = micPeakTimes[i] - micPeakTimes[i - 1];
              if (dt >= 270 && dt <= 1600) {
                intervals.push(dt);
              }
            }
            if (intervals.length >= 2) {
              const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
              micDetectedBpm = Math.round(60000 / avgMs);
              updateMicBpmButtonUI();
            }
          }
        }

        bpmSmoothedLevel = bpmSmoothedLevel * 0.82 + normalizedLevel * 0.18;

        if (state.isPulseActive && state.pulseEffect === 'bpm') {
          renderBpmFrame(bpmSmoothedLevel, isPulseHit);
        }

        micRafId = requestAnimationFrame(processMicBeatFrame);
      }

      function stopMicBpmDetection(silent = false) {
        isMicListening = false;
        micStarting = false;
        resetBpmVisuals();
        if (micRafId !== null) {
          cancelAnimationFrame(micRafId);
          micRafId = null;
        }
        if (micSourceNode) {
          try { micSourceNode.disconnect(); } catch (e) {}
          micSourceNode = null;
        }
        if (micStream) {
          micStream.getTracks().forEach((track) => track.stop());
          micStream = null;
        }
        if (micAudioCtx) {
          micAudioCtx.close().catch(() => {});
          micAudioCtx = null;
        }
        micAnalyser = null;
        micTimeData = null;
        micPeakTimes = [];
        micLastPeakMs = 0;
        bpmLastVisualPulseMs = 0;
        bpmLastColorChangeMs = 0;
        const lastDetectedBpm = micDetectedBpm;
        micDetectedBpm = null;
        updateMicBpmButtonUI();
        if (!silent) {
          showToast(lastDetectedBpm ? `Mic stopped (${lastDetectedBpm} BPM)` : 'Microphone stopped');
        }
      }

      async function startMicBpmDetection() {
        if (isMicListening || micStarting) return;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Microphone not supported on this browser');
          return;
        }

        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) {
          showToast('Web Audio API not supported');
          return;
        }

        micStarting = true;
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });

          if (!state.isPulseActive || state.pulseEffect !== 'bpm') {
            stopMicBpmDetection(true);
            return;
          }

          micAudioCtx = new AudioContextCtor();
          if (micAudioCtx.state === 'suspended') {
            await micAudioCtx.resume();
          }

          micSourceNode = micAudioCtx.createMediaStreamSource(micStream);
          micAnalyser = micAudioCtx.createAnalyser();
          micAnalyser.fftSize = 512;
          micTimeData = new Uint8Array(micAnalyser.fftSize);

          micSourceNode.connect(micAnalyser);

          micPeakTimes = [];
          micLastPeakMs = 0;
          bpmLastVisualPulseMs = 0;
          bpmLastColorChangeMs = 0;
          bpmSmoothedLevel = 0;
          micStarting = false;
          isMicListening = true;
          updateMicBpmButtonUI();
          showToast('Listening to music beat...');
          micRafId = requestAnimationFrame(processMicBeatFrame);
        } catch (err) {
          stopMicBpmDetection(true);
          if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
            showToast('Microphone permission denied');
          } else if (err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')) {
            showToast('No microphone detected');
          } else {
            showToast('Could not access microphone');
          }
        }
      }

      function captureReactionSnapshot(targetEntryId) {
        if (!camStream || !reactionVideo || !reactionCanvas) return;
        const rawW = reactionVideo.videoWidth || 640;
        const rawH = reactionVideo.videoHeight || 480;
        const maxDim = 360;
        const scale = Math.min(1, maxDim / Math.max(rawW, rawH));
        const width = Math.round(rawW * scale);
        const height = Math.round(rawH * scale);

        reactionCanvas.width = width;
        reactionCanvas.height = height;
        const ctx = reactionCanvas.getContext('2d');
        if (!ctx) return;

        ctx.save();
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(reactionVideo, 0, 0, width, height);
        ctx.restore();

        const dataUrl = reactionCanvas.toDataURL('image/jpeg', 0.62);
        attachPhotoToRecent(targetEntryId, dataUrl);
        showToast('Reaction captured! 📸');
      }

      function startReactionCountdown(targetEntryId) {
        if (!state.isCamArmed || !camStream) return;
        clearPendingCamTimers();

        let secondsLeft = 3;
        if (camCountdownText) camCountdownText.textContent = `Reaction Cam in ${secondsLeft}s...`;
        if (camCountdownPill) camCountdownPill.classList.remove('hidden');

        camCountdownTimer = setInterval(() => {
          secondsLeft -= 1;
          if (secondsLeft > 0) {
            if (camCountdownText) camCountdownText.textContent = `Reaction Cam in ${secondsLeft}s...`;
          } else {
            clearInterval(camCountdownTimer);
            camCountdownTimer = null;
          }
        }, 1000);

        camCaptureTimeout = setTimeout(() => {
          if (camCountdownPill) camCountdownPill.classList.add('hidden');
          captureReactionSnapshot(targetEntryId);
          camCaptureTimeout = null;
        }, 3000);
      }

      function openPhotoPreview(photoUrl, captionText) {
        if (!photoPreviewModal || !photoPreviewImg) return;
        photoPreviewImg.src = photoUrl;
        if (photoPreviewCaption) photoPreviewCaption.textContent = captionText || '';
        if (downloadPhotoBtn) {
          downloadPhotoBtn.href = photoUrl;
        }
        photoPreviewModal.classList.remove('hidden');
      }

      function closePhotoPreview() {
        if (photoPreviewModal) photoPreviewModal.classList.add('hidden');
      }

      function stopReactionCam(silent = false) {
        clearPendingCamTimers();
        if (camStream) {
          camStream.getTracks().forEach((track) => track.stop());
          camStream = null;
        }
        if (reactionVideo) {
          reactionVideo.srcObject = null;
        }
        state.isCamArmed = false;
        updateCamButtonUI();
        if (!silent) {
          showToast('Reaction camera off');
        }
      }

      async function toggleReactionCam() {
        if (state.isCamArmed) {
          stopReactionCam(false);
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Camera not supported on this browser');
          return;
        }

        try {
          camStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false,
          });

          if (reactionVideo) {
            reactionVideo.srcObject = camStream;
            await reactionVideo.play().catch(() => {});
          }

          state.isCamArmed = true;
          updateCamButtonUI();
          showToast('Reaction cam armed for SHOW 📸');
        } catch (err) {
          stopReactionCam(true);
          if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
            showToast('Camera permission denied');
          } else if (err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')) {
            showToast('No camera detected');
          } else {
            showToast('Could not access camera');
          }
        }
      }

      // --- Message State & Unlimited Persistent Recent History ---
      function setMessageText(nextText, syncInput = true) {
        state.text = nextText || '';
        if (state.text) {
          state.hasUserTappedToType = true;
          dismissStartupHint();
        }
        if (syncInput && messageInput && messageInput.value !== state.text) {

      async function savePresetsToCloud() {
        persistPresetsLocally();

        try {
          const prefsRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'preferences');

      function removePresetAtIndex(index) {
        if (index < 0 || index >= state.presets.length) return;
        state.presets.splice(index, 1);
        if (editingPresetIndex === index) {
          editingPresetIndex = null;
        } else if (editingPresetIndex !== null && editingPresetIndex > index) {
          editingPresetIndex -= 1;
        }
        renderPresets();
        renderEditPresetsMenu();
        savePresetsToCloud();
        showToast('Preset removed');

      function updatePresetAtIndex(index, nextValue) {
        if (index < 0 || index >= state.presets.length) return;
        const cleaned = (nextValue || '').trim();
        editingPresetIndex = null;
        if (!cleaned || cleaned === state.presets[index]) {
          renderEditPresetsMenu();

        }
        state.presets[index] = cleaned;
        renderPresets();
        renderEditPresetsMenu();
        savePresetsToCloud();
        showToast('Preset updated');

      async function attachPhotoToRecent(entryId, photoDataUrl) {
        if (!entryId || !photoDataUrl) return;
        state.recent = state.recent.map((item) =>
          item.id === entryId ? { ...item, photo: photoDataUrl } : item
        );
        persistRecentLocally();
        renderRecentList();

        if (!db || !currentUser) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', entryId);
          await setDoc(docRef, { photo: photoDataUrl, updatedAt: Date.now() }, { merge: true });
        } catch (err) {
          console.error('Error saving reaction photo:', err);
        }
      }

      async function addToRecent(phrase, options = {}) {
        const clean = (phrase || '').trim();
        const allowPhotoOnly = Boolean(options.allowPhotoOnly);
        if (!clean && !allowPhotoOnly) return null;

        const displayText = clean || 'REACTION SNAPSHOT';
        const now = Date.now();
        const entryId = `msg_${now}_${Math.random().toString(36).slice(2, 8)}`;
        const activePulseEffect = state.isPulseActive ? normalizePulseEffect(state.pulseEffect) : null;

        const duplicate = !allowPhotoOnly
          ? state.recent.find(
              (item) =>
                !item.isPhotoOnly &&
                item.text === displayText &&
                item.color === state.activeColor &&
                Boolean(item.isPulseActive) === state.isPulseActive &&
                (Boolean(item.isPulseActive) ? normalizePulseEffect(item.pulseEffect) : null) === activePulseEffect &&
                Boolean(item.isLandscape) === state.isLandscape
            )
          : null;

        const targetId = duplicate ? duplicate.id : entryId;
        const existingPhoto = duplicate ? duplicate.photo || null : null;

        const newEntry = {
          id: targetId,
          text: displayText,
          color: state.activeColor,
          isPulseActive: state.isPulseActive,
          pulseEffect: activePulseEffect,
          isLandscape: state.isLandscape,
          isPhotoOnly: allowPhotoOnly && !clean,
          photo: existingPhoto,
          updatedAt: now,
        };

        state.recent = [newEntry, ...state.recent.filter((item) => item.id !== targetId)];
        persistRecentLocally();
        updateRecentBadge();
        renderRecentList();

        if (db && currentUser) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', targetId);
            await setDoc(docRef, {
              text: newEntry.text,
              color: newEntry.color,
              isPulseActive: newEntry.isPulseActive,
              pulseEffect: newEntry.pulseEffect,
              isLandscape: newEntry.isLandscape,
              isPhotoOnly: newEntry.isPhotoOnly,
              photo: newEntry.photo || null,
              updatedAt: newEntry.updatedAt,
            });
          } catch (err) {
            console.error('Error saving recent message:', err);
          }
        }

        return targetId;
      }

      async function deleteRecentItem(itemId) {
        if (!itemId) return;
        state.recent = state.recent.filter((item) => item.id !== itemId);
        persistRecentLocally();
        updateRecentBadge();
        renderRecentList();
        showToast('Message removed');

        if (!db || !currentUser) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', itemId);
          await deleteDoc(docRef);
        } catch (err) {
          console.error('Error deleting recent message:', err);
        }
      }

      async function clearAllRecentItems() {
        const itemsToDelete = [...state.recent];
        state.recent = [];
        persistRecentLocally();
        updateRecentBadge();
        renderRecentList();
        showToast('History cleared');

        if (!db || !currentUser || !itemsToDelete.length) return;
        try {
          for (let i = 0; i < itemsToDelete.length; i += 450) {
            const batch = writeBatch(db);
            itemsToDelete.slice(i, i + 450).forEach((item) => {
              const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'recentMessages', item.id);
              batch.delete(docRef);
            });
            await batch.commit();
          }
        } catch (err) {
          console.error('Error clearing recent history:', err);
        }
      }

      function updateRecentBadge() {
        if (!recentBadge) return;
        recentBadge.textContent = String(state.recent.length);
      }

        if (!state.recent.length) {

            landBadge.textContent = 'LANDSCAPE';

            pulseBadge.textContent = normalizePulseEffect(item.pulseEffect).toUpperCase();
            badgesWrap.appendChild(pulseBadge);

          selectBtn.appendChild(badgesWrap);

            setPulseState(
              shouldEnablePulse,

            );

            const thumbImg = document.createElement('img');
            thumbImg.src = item.photo;
            thumbImg.alt = 'Reaction';

              e.stopPropagation();

            });
            row.appendChild(thumbBtn);

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.setAttribute('aria-label', `Delete ${item.text}`);
          deleteBtn.title = 'Delete message';

          deleteBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>

              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>

      // --- Delete Confirmation Modal Handlers ---
      function openDeleteConfirmation({ title, message, confirmLabel, onConfirm }) {
